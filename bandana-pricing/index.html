<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bandana Pricing — Desk Reference</title>

<style>
:root{
  --yellow:#F7BE00; --black:#000; --tonal:#232323;
  --bg:#fff; --card:#fff; --border:#e6e6e6; --ink:#000; --muted:#6f6f6f;
  --thead:#E8E8E8; --hover:#f5f5f5; --spark:#9a9a9a;
  --warnbg:#fff7e0; --warnink:#7a5b00;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#161616; --card:#1e1e1e; --border:#333; --ink:#fff; --muted:#9d9d9d;
    --thead:#2a2a2a; --hover:#262626; --spark:#777;
    --warnbg:#3a2f07; --warnink:#f0d27a; }
}
:root[data-theme="light"]{ --bg:#fff; --card:#fff; --border:#e6e6e6; --ink:#000; --muted:#6f6f6f;
  --thead:#E8E8E8; --hover:#f5f5f5; --spark:#9a9a9a; --warnbg:#fff7e0; --warnink:#7a5b00; }
:root[data-theme="dark"]{ --bg:#161616; --card:#1e1e1e; --border:#333; --ink:#fff; --muted:#9d9d9d;
  --thead:#2a2a2a; --hover:#262626; --spark:#777; --warnbg:#3a2f07; --warnink:#f0d27a; }

*{box-sizing:border-box; margin:0; padding:0}
body{
  font-family:'Montserrat','Avenir Next','Proxima Nova','Helvetica Neue',Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.6;
}
button{font:inherit; cursor:pointer}

/* ---------- header / footer (always black — brand band) ---------- */
header{
  background:var(--black); color:#fff; padding:26px 32px 22px;
  display:flex; align-items:center; gap:20px; flex-wrap:wrap;
  border-bottom:4px solid var(--yellow);
}
header .titleblock{flex:1; min-width:220px}
header h1{font-size:21px; font-weight:800; letter-spacing:.22em; text-transform:uppercase}
header .sub{font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:#bbb; margin-top:4px}
.oicon{width:40px; height:40px; color:#fff; flex:none}
.oicon svg{width:100%; height:100%; display:block}
.badge{
  font-size:10px; font-weight:800; letter-spacing:.16em; text-transform:uppercase;
  padding:6px 12px; border-radius:3px; white-space:nowrap;
}
.badge.internal{background:var(--yellow); color:#000}
.badge.customer{background:#fff; color:#000}
.viewtoggle{display:flex; align-items:center; gap:10px; color:#fff;
  font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase}
.switch{position:relative; width:44px; height:24px; background:#555; border:none; border-radius:12px; transition:background .15s}
.switch::after{content:""; position:absolute; top:3px; left:3px; width:18px; height:18px;
  border-radius:50%; background:#fff; transition:left .15s}
.switch[aria-pressed="true"]{background:var(--yellow)}
.switch[aria-pressed="true"]::after{left:23px}
.thememode{background:none; border:1px solid #555; color:#fff; border-radius:3px;
  padding:5px 10px; font-size:10px; letter-spacing:.14em; text-transform:uppercase}

footer{
  background:var(--black); color:#999; margin-top:64px; padding:20px 32px;
  display:flex; align-items:center; gap:14px; font-size:11px; letter-spacing:.12em; text-transform:uppercase;
}
footer .oicon{width:22px; height:22px; color:#fff}

/* ---------- filter bar ---------- */
.filters{
  display:flex; align-items:center; gap:22px; flex-wrap:wrap;
  padding:20px 32px; border-bottom:1px solid var(--border);
}
.fgroup{display:flex; align-items:center; gap:8px}
.flabel{font-size:10px; font-weight:800; letter-spacing:.18em; text-transform:uppercase; color:var(--muted)}
.chip{
  border:1px solid var(--border); background:var(--card); color:var(--ink);
  border-radius:3px; padding:5px 12px; font-size:11px; font-weight:700;
  letter-spacing:.08em; text-transform:uppercase;
}
.chip:hover{background:var(--hover)}
.chip.on{background:var(--yellow); border-color:var(--yellow); color:#000}
.qtyin{
  border:1px solid var(--border); background:var(--card); color:var(--ink);
  border-radius:3px; padding:6px 10px; font-size:13px; width:110px; font-family:inherit;
}
.qtyin:focus{outline:2px solid var(--yellow); outline-offset:0; border-color:var(--yellow)}
.skuin{width:150px; text-transform:uppercase; letter-spacing:.04em}
.skuin::placeholder{text-transform:none; letter-spacing:normal}

main{padding:32px; max-width:1280px; margin:0 auto}

/* ---------- tiles ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:18px}
.tile{
  background:var(--card); border:1px solid var(--border); border-radius:6px;
  padding:20px 20px 16px; text-align:left; color:var(--ink);
  display:flex; flex-direction:column; gap:8px; transition:border-color .12s, transform .12s;
}
.tile:hover{border-color:var(--ink); transform:translateY(-2px)}
.tile .lname{font-size:13px; font-weight:800; letter-spacing:.18em; text-transform:uppercase}
.tile .lmeta{font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.tile .range{font-size:22px; font-weight:800; letter-spacing:.01em}
.tile .range .per{font-size:11px; font-weight:600; color:var(--muted); letter-spacing:.08em}
.tile .atqty{font-size:11px; font-weight:700; color:var(--ink)}
.tile .atqty b{background:var(--yellow); color:#000; padding:1px 5px; border-radius:2px}
.sparkrow{display:flex; align-items:flex-end; gap:10px; margin-top:2px; min-height:34px}
.sparkrow .mlabel{font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); line-height:1.3}
.qcbadge{
  align-self:flex-start; font-size:9px; font-weight:800; letter-spacing:.12em; text-transform:uppercase;
  background:var(--warnbg); color:var(--warnink); border-radius:3px; padding:3px 8px;
}
.empty{color:var(--muted); font-size:13px; padding:40px 0; text-align:center; letter-spacing:.06em}

/* ---------- detail ---------- */
.back{
  background:none; border:none; color:var(--ink); font-size:11px; font-weight:800;
  letter-spacing:.18em; text-transform:uppercase; padding:0 0 18px; display:inline-block;
}
.back:hover{color:var(--muted)}
.dhead{display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; margin-bottom:6px}
.dhead h2{font-size:24px; font-weight:800; letter-spacing:.2em; text-transform:uppercase}
.dhead .skus{font-size:11px; letter-spacing:.1em; color:var(--muted); text-transform:uppercase}
.inktabs{display:flex; gap:8px; margin:14px 0 4px}
.dnote{font-size:11px; color:var(--muted); letter-spacing:.06em; margin-top:10px}

.matrixwrap{overflow-x:auto; margin-top:16px; border:1px solid var(--border); border-radius:6px}
table{border-collapse:collapse; width:100%; min-width:520px}
th,td{padding:10px 14px; text-align:right; font-size:13px; border-bottom:1px solid var(--border)}
th{
  background:var(--thead); font-size:10px; font-weight:800; letter-spacing:.16em;
  text-transform:uppercase; text-align:right;
}
th:first-child, td:first-child{text-align:left; font-weight:700; white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
td.cell{cursor:pointer; font-variant-numeric:tabular-nums; font-weight:600}
td.cell:hover, td.cell.pinned{background:var(--hover); outline:2px solid var(--yellow); outline-offset:-2px}
td.cell .flagmark{color:var(--warnink); font-weight:800; margin-left:2px}
td.dim{color:var(--muted); font-weight:400}
tr.qhit td:first-child{box-shadow:inset 4px 0 0 var(--yellow)}
tr.qhit td{background:var(--hover)}

/* ---------- popover ---------- */
#pop{
  position:fixed; z-index:50; background:var(--card); color:var(--ink);
  border:1px solid var(--ink); border-radius:6px; padding:14px 16px; min-width:200px;
  box-shadow:0 8px 24px rgba(0,0,0,.18); display:none;
}
#pop .ptitle{font-size:10px; font-weight:800; letter-spacing:.16em; text-transform:uppercase;
  border-bottom:2px solid var(--yellow); padding-bottom:6px; margin-bottom:8px}
#pop dl{display:grid; grid-template-columns:auto auto; gap:3px 18px; font-size:13px}
#pop dt{color:var(--muted); font-size:10px; letter-spacing:.12em; text-transform:uppercase; align-self:baseline}
#pop dd{text-align:right; font-weight:700; font-variant-numeric:tabular-nums}
#pop .pflag{margin-top:8px; font-size:10px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
  background:var(--warnbg); color:var(--warnink); border-radius:3px; padding:3px 8px; display:inline-block}

/* ---------- customer view hides all cost/margin ---------- */
body[data-view="customer"] .internal{display:none !important}

@media (max-width:640px){
  header,main,.filters,footer{padding-left:18px; padding-right:18px}
  main{padding-top:22px}
}
</style>
</head>

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = v => '$' + v.toFixed(2);
const moneyT = v => '$' + Math.round(v).toLocaleString('en-US');
const pct = m => { const p = Math.round(m*1000)/10; return (p % 1 ? p.toFixed(1) : p.toFixed(0)) + '%'; };
const colLabel = c => c === 0 ? 'Full-Color' : c + ' Color' + (c>1?'s':'');
const colShort = c => c === 0 ? 'FC' : c + 'C';

/* ---------- SKU derivation & resolution (from the SKU Master Map sheet) ----------
   The flat-tab export carries no `sku` column, so we derive SKUs here. A real
   `sku` field on a record (future export) always wins over these maps.

   PRIMARY_SKU  = the public SKU shown on each tile (one per pricing line).
   SKU_TO_LINE  = EVERY catalog SKU → the pricing line it quotes from. Triangles
                  and internal variants share their family's curve, so a search
                  (and the auto-responder) resolves them to the right line.
   ⚠ "Organic Edge" and "27\" Eco" are priced tabs with NO SKU in the master
     sheet yet — left blank until Holly creates/confirms them.
   Not loaded here (no pricing curve in DATA): Sublimation (SUB*), DIGCR25
   (cotton/rayon, pricing pending), BELBAN (belly-band finishing). */
const PRIMARY_SKU = {
  "Classic":"PL2220",        "Classic Eco":"PL2220ECO", "Classic Edge":"PL2222ECO",
  "USA":"US2120",            "USA Eco":"US2120ECO",     "USA Edge":"US2121ECO",
  "Organic":"ORG2420",       "Organic Eco":"ORG2420ECO",
  "Full-Color":"DIG22",      "Triangle":"DIGTRI22",
  "27\" Oversized":"PL2720",  "Prototype":"PROTOTYPE"
};
const SKU_TO_LINE = {
  PL2220:"Classic", TRIBAN14:"Classic", TRIBAN22:"Classic",
  PL2220ECO:"Classic Eco", TRIBAN14ECO:"Classic Eco", TRIBAN22ECO:"Classic Eco",
  PL2222ECO:"Classic Edge",
  US2120:"USA", US2119:"USA", USTRIBAN14:"USA", USTRIBAN22:"USA",
  US2120ECO:"USA Eco",
  US2121ECO:"USA Edge", US2121:"USA Edge",
  ORG2420:"Organic", ORG2422:"Organic",
  ORG2420ECO:"Organic Eco", ORG2422ECO:"Organic Eco",
  DIG22:"Full-Color", CUSTOMDIGBAN:"Full-Color",
  DIGTRI22:"Triangle", DIGTRI14:"Triangle",
  PL2720:"27\" Oversized", PL2722:"27\" Oversized",
  PROTOTYPE:"Prototype", PROTO:"Prototype"
};
const skuOf = r => r.sku || PRIMARY_SKU[r.line] || '';
const skuForLine = line => { const r = DATA.find(d => d.line === line); return (r && r.sku) || PRIMARY_SKU[line] || ''; };
const lineForSku = q => SKU_TO_LINE[String(q).trim().toUpperCase()] || null;

/* aliases per line → a search on ANY real SKU (triangle, internal, old name) finds its family */
const LINE_ALIASES = {};
Object.keys(SKU_TO_LINE).forEach(s => { const l = SKU_TO_LINE[s]; (LINE_ALIASES[l] = LINE_ALIASES[l] || []).push(s); });
const lineHaystack = line => [skuForLine(line), line, ...(LINE_ALIASES[line] || [])].join(' ').toUpperCase();
/* a full SKU resolves to exactly one line; a partial string falls back to substring search */
const matchLine = (line, q) => !q ? true : (SKU_TO_LINE[q] ? line === SKU_TO_LINE[q] : lineHaystack(line).includes(q));

/* auto-responder query surface: priceBreaks("TRIBAN22") → every qty×color break for that SKU's price line */
window.priceBreaks = sku => {
  const line = lineForSku(sku), key = String(sku).trim().toUpperCase();
  return DATA
    .filter(r => line ? r.line === line : skuOf(r).toUpperCase() === key)
    .map(({qty,colors,price,sp,margin,total,ink,shape}) => ({qty,colors,price,sp,margin,total,ink,shape}))
    .sort((a,b) => a.qty - b.qty || a.colors - b.colors);
};

/* canonical tile order; unknown lines from the real array append at the end */
const LINE_ORDER = ["Classic","Classic Eco","Classic Edge","USA","USA Eco","USA Edge",
  "Organic","Organic Eco","Organic Edge","Full-Color","Triangle","27\" Oversized","27\" Eco","Sublimation"];
const lines = [...new Set(DATA.map(r => r.line))]
  .sort((a,b) => {
    const ia = LINE_ORDER.indexOf(a), ib = LINE_ORDER.indexOf(b);
    return (ia<0?99:ia) - (ib<0?99:ib) || a.localeCompare(b);
  });
const INKS   = [...new Set(DATA.map(r => r.ink))];
const SHAPES = [...new Set(DATA.map(r => r.shape))];

const state = { ink:'All', shape:'All', qty:null, sku:'', customer:false, open:null, inkTab:null, pinned:null };

const recsFor = line => DATA.filter(r =>
  r.line === line &&
  (state.ink === 'All' || r.ink === state.ink) &&
  (state.shape === 'All' || r.shape === state.shape)
);

function nearestTier(recs, q){
  const tiers = [...new Set(recs.map(r => r.qty))];
  if (!tiers.length || q == null) return null;
  return tiers.reduce((best,t) => Math.abs(t-q) < Math.abs(best-q) ? t : best);
}

/* margin series for the QC sparkline: cheapest color count, dominant ink, qty ascending */
function marginSeries(recs){
  if (!recs.length) return [];
  const byInk = {};
  recs.forEach(r => (byInk[r.ink] = byInk[r.ink] || []).push(r));
  const ink = Object.keys(byInk).sort((a,b) => byInk[b].length - byInk[a].length)[0];
  const pool = byInk[ink];
  const c = Math.min(...pool.map(r => r.colors));
  return pool.filter(r => r.colors === c).sort((a,b) => a.qty - b.qty);
}

/* natural curve = margin falls as qty rises; flag flat or rising curves */
function curveQC(series){
  return null;   // desk build: no margin data present
  if (series.length < 2) return null;
  const m = series.map(r => r.margin);
  if (Math.max(...m) - Math.min(...m) < 0.02) return 'FLAT CURVE';
  if (m[m.length-1] > m[0]) return 'INVERTED CURVE';
  for (let i=1;i<m.length;i++) if (m[i] > m[i-1] + 0.02) return 'CURVE BUMP';
  return null;
}

function sparkline(series){
  return "";   // desk build: margin sparkline removed

  if (series.length < 2){
    return `<svg width="96" height="28" aria-hidden="true"><circle cx="8" cy="14" r="4" fill="var(--spark)"/></svg>`;
  }
  const w=96, h=28, pad=5;
  const m = series.map(r => r.margin);
  const lo = Math.min(...m), hi = Math.max(...m), span = (hi-lo) || 1;
  const pts = m.map((v,i) => [
    pad + i*(w-2*pad)/(m.length-1),
    h-pad - (v-lo)/span*(h-2*pad)
  ]);
  const path = pts.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ');
  const [ex,ey] = pts[pts.length-1];
  return `<svg width="${w}" height="${h}" aria-hidden="true">
    <polyline points="${path}" fill="none" stroke="var(--spark)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${ex}" cy="${ey}" r="5" fill="var(--card)"/>
    <circle cx="${ex}" cy="${ey}" r="4" fill="var(--yellow)" stroke="var(--ink)" stroke-width="1"/>
  </svg>`;
}

/* ---------- front page: tiles ---------- */
function renderGrid(){
  const q = state.sku.trim().toUpperCase();
  const cards = lines.map(line => {
    if (!matchLine(line, q)) return '';
    const recs = recsFor(line);
    if (!recs.length) return '';
    const prices = recs.map(r => r.price);
    const lo = Math.min(...prices), hi = Math.max(...prices);
    const skus = [...new Set(recs.map(skuOf))].join(' · ');
    const inks = [...new Set(recs.map(r => r.ink))].join(' + ');
    const series = marginSeries(recs);
    const qc = curveQC(series);
    const mNote = '' || (false && series.length
      ? (series.length > 1
          ? ``
          : ``)
      : '');
    let atQty = '';
    if (state.qty){
      const t = nearestTier(recs, state.qty);
      if (t != null){
        const pool = recs.filter(r => r.qty === t);
        const c = Math.min(...pool.map(r => r.colors));
        const rec = pool.find(r => r.colors === c);
        atQty = `<div class="atqty"><b>${t} pcs</b>&nbsp; ${money(rec.price)}/u &middot; ${colShort(rec.colors)}${t !== state.qty ? ' &middot; nearest tier' : ''}</div>`;
      }
    }
    return `<button class="tile" data-line="${esc(line)}">
      <div class="lname">${esc(line)}</div>
      <div class="lmeta">${skus ? esc(skus)+'<br>' : ''}${esc(inks)}</div>
      <div class="range">${money(lo)}${hi>lo ? '&thinsp;–&thinsp;'+money(hi) : ''} <span class="per">/ unit</span></div>
      ${atQty}
      <div class="sparkrow internal">${sparkline(series)}<div class="mlabel">${mNote}</div></div>
      ${qc ? `<span class="qcbadge internal">&#9888; ${qc}</span>` : ''}
    </button>`;
  }).join('');
  $('#main').innerHTML = cards
    ? `<div class="grid">${cards}</div>`
    : `<div class="empty">${state.sku.trim()
        ? 'NO SKU MATCHES &ldquo;'+esc(state.sku.trim().toUpperCase())+'&rdquo;<div style="font-size:11px;margin-top:8px;letter-spacing:.04em">Sublimation (SUB…), cotton/rayon (DIGCR25) &amp; belly bands (BELBAN) aren&rsquo;t in this pricing set yet.</div>'
        : 'NO PRODUCTS MATCH THE CURRENT FILTERS'}</div>`;
  document.querySelectorAll('.tile').forEach(t =>
    t.addEventListener('click', () => { state.open = t.dataset.line; state.inkTab = null; render(); }));
}

/* ---------- detail: qty × colors matrix ---------- */
function renderDetail(){
  const line = state.open;
  const recs = recsFor(line);
  if (!recs.length){ state.open = null; renderGrid(); return; }

  const inks = [...new Set(recs.map(r => r.ink))];
  if (!state.inkTab || !inks.includes(state.inkTab)) state.inkTab = inks[0];
  const pool = recs.filter(r => r.ink === state.inkTab);

  const qtys = [...new Set(pool.map(r => r.qty))].sort((a,b) => a-b);
  const cols = [...new Set(pool.map(r => r.colors))].sort((a,b) => a-b);
  const hit  = state.qty != null ? nearestTier(pool, state.qty) : null;
  const cell = {};
  pool.forEach(r => cell[r.qty + '|' + r.colors] = r);

  const skus = [...new Set(pool.map(skuOf))].join(' · ');
  const shapes = [...new Set(pool.map(r => r.shape))].join(' · ');
  const series = marginSeries(recs);
  const qc = curveQC(series);
  const anyFlag = pool.some(r => r.flags);

  let idx = 0;
  const rows = qtys.map(q => {
    const tds = cols.map(c => {
      const r = cell[q + '|' + c];
      if (!r) return `<td class="dim">—</td>`;
      const i = idx++; r._i = i;
      return `<td class="cell" data-i="${DATA.indexOf(r)}">${money(r.price)}${r.flags ? '<span class="flagmark">*</span>' : ''}</td>`;
    }).join('');
    return `<tr${q === hit ? ' class="qhit"' : ''}><td>${q.toLocaleString('en-US')} pcs</td>${tds}</tr>`;
  }).join('');

  $('#main').innerHTML = `
    <button class="back" id="backBtn">&larr;&nbsp; All products</button>
    <div class="dhead">
      <h2>${esc(line)}</h2>
      <span class="skus">${skus ? esc(skus)+' &middot; ' : ''}${esc(shapes)}</span>
    </div>
    <div class="sparkrow internal">${sparkline(series)}
      
      ${qc ? `<span class="qcbadge">&#9888; ${qc}</span>` : ''}
    </div>
    ${inks.length > 1 ? `<div class="inktabs">${inks.map(i =>
      `<button class="chip${i === state.inkTab ? ' on' : ''}" data-ink="${esc(i)}">${esc(i)}</button>`).join('')}</div>` : ''}
    <div class="matrixwrap"><table>
      <thead><tr><th>Qty</th>${cols.map(c => `<th>${colLabel(c)}</th>`).join('')}</tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div class="dnote">All-in price per unit. ${anyFlag ? '<span class="flagmark">*</span> = flagged — hover or tap a cell for details. ' : ''}Hover or tap any price for project total.</div>`;

  $('#backBtn').addEventListener('click', () => { state.open = null; hidePop(); render(); });
  document.querySelectorAll('.inktabs .chip').forEach(b =>
    b.addEventListener('click', () => { state.inkTab = b.dataset.ink; hidePop(); renderDetail(); }));
  document.querySelectorAll('td.cell').forEach(td => {
    const r = DATA[+td.dataset.i];
    td.addEventListener('mouseenter', () => { if (state.pinned == null) showPop(td, r); });
    td.addEventListener('mouseleave', () => { if (state.pinned == null) hidePop(); });
    td.addEventListener('click', e => {
      e.stopPropagation();
      if (state.pinned === td){ state.pinned = null; hidePop(); return; }
      document.querySelectorAll('td.pinned').forEach(x => x.classList.remove('pinned'));
      state.pinned = td; td.classList.add('pinned'); showPop(td, r);
    });
  });
}

/* ---------- popover ---------- */
function showPop(td, r){
  const internal = false;   // desk build: cost data is not present in this file
  $('#pop').innerHTML = `
    <div class="ptitle">${esc(r.line)}${skuOf(r) ? ' &middot; '+esc(skuOf(r)) : ''}</div>
    <dl>
      <dt>Qty</dt><dd>${r.qty.toLocaleString('en-US')} pcs</dd>
      <dt>Imprint</dt><dd>${colLabel(r.colors)} &middot; ${esc(r.ink)}</dd>
      <dt>Price</dt><dd>${money(r.price)} /u</dd>
      ${internal ? `` : ''}
      <dt>Project total</dt><dd>${moneyT(r.total)}</dd>
    </dl>
    ${r.flags ? `<span class="pflag">&#9888; ${esc(r.flags)}</span>` : ''}`;
  const pop = $('#pop');
  pop.style.display = 'block';
  const c = td.getBoundingClientRect(), p = pop.getBoundingClientRect();
  let x = Math.min(Math.max(8, c.left + c.width/2 - p.width/2), innerWidth - p.width - 8);
  let y = c.top - p.height - 10;
  if (y < 8) y = c.bottom + 10;
  pop.style.left = x + 'px'; pop.style.top = y + 'px';
}
function hidePop(){
  $('#pop').style.display = 'none';
  document.querySelectorAll('td.pinned').forEach(x => x.classList.remove('pinned'));
  state.pinned = null;
}
document.addEventListener('click', e => { if (!e.target.closest('td.cell') && !e.target.closest('#pop')) hidePop(); });
document.addEventListener('scroll', hidePop, true);
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (state.pinned) hidePop();
  else if (state.open){ state.open = null; render(); }
});

/* ---------- filters ---------- */
function chipRow(el, all, key){
  el.innerHTML = ['All', ...all].map(v =>
    `<button class="chip${state[key] === v ? ' on' : ''}" data-v="${esc(v)}">${esc(v)}</button>`).join('');
  el.querySelectorAll('.chip').forEach(b =>
    b.addEventListener('click', () => { state[key] = b.dataset.v; hidePop(); renderFilters(); render(); }));
}
function renderFilters(){
  chipRow($('#inkChips'), INKS, 'ink');
  chipRow($('#shapeChips'), SHAPES, 'shape');
}
$('#qtyIn').addEventListener('input', e => {
  const v = parseInt(e.target.value, 10);
  state.qty = isNaN(v) ? null : v;
  render();
});

/* SKU search: narrows the grid to matching products; Enter jumps to the top match's full price-break matrix */
function skuMatches(){
  const q = state.sku.trim().toUpperCase();
  return q ? lines.filter(l => matchLine(l, q) && recsFor(l).length) : [];
}
$('#skuIn').addEventListener('input', e => {
  state.sku = e.target.value;
  if (state.open){ state.open = null; hidePop(); }
  render();
});
$('#skuIn').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const m = skuMatches();
  if (m.length){ state.sku = ''; e.target.value = ''; state.open = m[0]; state.inkTab = null; render(); }
});

/* ---------- theme ---------- */

const THEMES = ['', 'light', 'dark'];
let themeI = 0;
const urlTheme = new URLSearchParams(location.search).get('theme');
if (urlTheme === 'light' || urlTheme === 'dark'){
  themeI = THEMES.indexOf(urlTheme);
  document.documentElement.dataset.theme = urlTheme;
  $('#themeBtn').textContent = urlTheme;
}
$('#themeBtn').addEventListener('click', () => {
  themeI = (themeI + 1) % 3;
  const t = THEMES[themeI];
  if (t) document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
  $('#themeBtn').textContent = t || 'Auto';
});

/* ---------- boot ---------- */
function render(){ state.open ? renderDetail() : renderGrid(); }
document.body.dataset.view = 'internal';
renderFilters();
render();
</script>
