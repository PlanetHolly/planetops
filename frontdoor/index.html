<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planet Apparel</title>
<link rel="stylesheet" href="./app.css">
</head>
<body>

<!-- Auth lives at the SERVER now (frontdoor-gate service, Codex-reviewed) — the gate
     challenges before this page is even served. No client-side PIN screen anymore. -->
<div id="app" hidden>
  <header class="topbar">
    <button class="railToggle" id="railToggle" title="Show / hide the menu" aria-label="Toggle menu">☰</button>
    <div class="brand">
      <span class="brandLogo" id="brandLogo"></span>
      <span class="brandName" id="brandName">Planet Apparel</span>
    </div>
    <div class="searchWrap">
      <input id="search" type="search" placeholder="Search everything…" autocomplete="off" aria-label="Global search">
      <div id="searchResults" class="searchResults" hidden></div>
    </div>
    <a class="quickClock" href="../clock/" target="_blank" title="Time Clock — punch in/out">🕐</a>
    <div class="pinnedWrap">
      <span class="pinnedLabel">📌</span>
      <div id="pinnedChips" class="pinnedChips"></div>
    </div>
  </header>

  <div id="regError" class="regError" hidden></div>

  <div class="body">
    <nav class="rail" id="rail" aria-label="Hubs"></nav>
    <div class="flyout" id="flyout" hidden></div>
    <div class="flyout subflyout" id="subflyout" hidden></div>
    <main class="main">
      <div class="crumbs" id="crumbs"></div>
      <div id="pane"></div>
    </main>
  </div>

  <footer class="foot" id="foot"></footer>
</div>
