<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planet Sales · Retention — Live System Map</title>
<style>
  :root{
    --gold:#F7BE00; --ink:#111; --line:#dcdce0; --bg:#f4f4f5;
    --live:#047857; --dry:#b45309; --manual:#475569; --planned:#2563eb; --alarm:#dc2626;
    --red:#dc2626; --amber:#d97706;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .wrap{max-width:1240px;margin:0 auto;padding:24px 20px 64px;}
  a{color:inherit}

  /* header */
  header{background:var(--ink);color:#fff;border-radius:14px;padding:20px 24px;position:relative}
  header .o{position:absolute;top:16px;right:20px}
  header .o svg{height:26px;width:auto;color:var(--gold);display:block}
  .crumb{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);font-weight:800}
  header h1{margin:4px 0 0;font-size:26px}
  header .meta{margin:10px 0 0;color:#cfcfcf;font-size:12.5px;line-height:1.6}
  header .meta b{color:#fff}
  .sup{margin-top:9px;font-size:11.5px;color:#9aa4b2;line-height:1.55}
  .sup .pill{display:inline-block;background:#1f2937;border:1px solid #374151;border-radius:999px;padding:2px 9px;margin:2px 4px 0 0;font-size:10.5px;color:#cbd5e1}

  h2{font-size:14px;text-transform:uppercase;letter-spacing:1.2px;color:#444;margin:30px 0 12px;border-bottom:2px solid var(--line);padding-bottom:6px}
  h2 .sub{text-transform:none;letter-spacing:0;font-weight:500;color:#8a8a8a;font-size:12px;margin-left:8px}

  /* alarm panel */
  .alarmHead{display:flex;align-items:baseline;gap:10px;margin:22px 0 12px}
  .alarmHead h2{margin:0;border:0;padding:0}
  .alarmCount{font-size:12px;font-weight:800;color:#fff;background:var(--red);border-radius:999px;padding:2px 10px}
  .alarmCount.amber{background:var(--amber)}
  .alarms{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .alarm{background:#fff;border:1px solid var(--line);border-left:6px solid var(--amber);border-radius:11px;padding:13px 15px}
  .alarm.red{border-left-color:var(--red)}
  .alarm .top{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px}
  .alarm .dot{width:11px;height:11px;border-radius:50%;background:var(--amber);flex:0 0 auto;box-shadow:0 0 0 3px rgba(217,119,6,.18)}
  .alarm.red .dot{background:var(--red);box-shadow:0 0 0 3px rgba(220,38,38,.18)}
  .alarm .lvl{margin-left:auto;font-size:9.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--amber)}
  .alarm.red .lvl{color:var(--red)}
  .alarm .det{font-size:12.5px;line-height:1.5;color:#333;margin:8px 0 0}
  .alarm .fix{font-size:11.5px;line-height:1.5;margin:9px 0 0;padding-top:8px;border-top:1px dashed #e5e7eb}
  .alarm .fix b{color:#000}
  .alarm .who{display:inline-block;font-size:10px;font-weight:700;background:#f1f5f9;color:#475569;border-radius:5px;padding:1px 7px;margin-left:4px}

  /* systems strip */
  .sys{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .sysCard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px 16px;border-top:4px solid var(--live)}
  .sysCard.unverified{border-top-color:var(--dry)} .sysCard.manual{border-top-color:var(--amber)}
  .sysCard h3{margin:0 0 6px;font-size:14px;display:flex;align-items:center;gap:8px}
  .sysCard .letter{font-size:12px;font-weight:800;color:#fff;background:var(--live);width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center}
  .sysCard.unverified .letter{background:var(--dry)} .sysCard.manual .letter{background:var(--amber)}
  .sysCard p{margin:0;font-size:12px;line-height:1.5;color:#444}
  .sysCard .flag{display:block;margin-top:8px;font-size:11px;color:var(--dry);background:#fff8eb;border:1px solid #fde3a7;border-radius:6px;padding:5px 9px;line-height:1.45}

  /* cadence clock */
  .clock{background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .clock .row{display:flex;gap:14px;padding:9px 15px;border-bottom:1px solid #eee;font-size:12.5px;align-items:baseline}
  .clock .row:last-child{border-bottom:0}
  .clock .when{flex:0 0 210px;font-weight:800;color:#0f172a}
  .clock .items{color:#333;line-height:1.4}
  .clock .row.dead .items{color:#9ca3af;text-decoration:line-through}
  .clock .row.dead .when{color:#9ca3af}
  .clock .n{font-size:11px;color:var(--dry);margin-left:6px}

  /* lifecycle flow */
  .flow{background:#fff;border:1px solid var(--line);border-radius:11px;padding:16px 14px}
  .spine{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
  .stageCol{flex:1;min-width:132px;display:flex;flex-direction:column;gap:7px}
  .stageChip{border-radius:9px;color:#fff;padding:8px 10px;text-align:center;font-weight:800;font-size:12.5px;line-height:1.15}
  .stageChip small{display:block;font-weight:500;opacity:.9;font-size:9.5px;margin-top:2px}
  .autos{display:flex;flex-direction:column;gap:6px}
  .node{border:1px solid #e5e7eb;border-radius:8px;padding:7px 9px;font-size:11px;line-height:1.35;position:relative;background:#fff}
  .node .nm{font-weight:800;font-size:11.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .node .b{font-size:8px;font-weight:800;border-radius:4px;padding:1px 5px;color:#fff;letter-spacing:.3px}
  .node .b.live{background:var(--live)} .node .b.dry{background:var(--dry)} .node .b.manual{background:var(--manual)}
  .node .b.planned{background:var(--planned)} .node .b.alarm{background:var(--alarm)}
  .node .sy{font-size:8px;font-weight:800;color:#94a3b8;border:1px solid #e2e8f0;border-radius:4px;padding:0 4px}
  .node .cad{color:#64748b;margin-top:3px;font-size:10px}
  .node .nx{color:var(--dry);margin-top:3px;font-size:10px;line-height:1.4}
  .node.dry{background:#fffbeb;border-color:#f5c451}
  .node.alarm{background:#fef2f2;border-color:#fca5a5}
  .node.manual{background:#f8fafc}

  /* trigger table */
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:12px}
  th,td{text-align:left;padding:8px 11px;border-bottom:1px solid #eee;vertical-align:top;line-height:1.45}
  th{background:#f3f4f6;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:#555}
  td.nmc{font-weight:700;white-space:nowrap}
  td code{background:#f1f5f9;border-radius:4px;padding:1px 5px;font-size:10.5px;color:#475569}
  .badge{display:inline-block;font-size:9.5px;font-weight:800;border-radius:5px;padding:2px 7px;color:#fff;white-space:nowrap}
  .badge.live{background:var(--live)} .badge.dry{background:var(--dry)} .badge.manual{background:var(--manual)}
  .badge.planned{background:var(--planned)} .badge.alarm{background:var(--alarm)}
  tr.sysA{} tr.sysB td.nmc{color:#7c4a03} tr.sysC td.nmc{color:#475569}

  .legend{display:flex;gap:14px;flex-wrap:wrap;margin:12px 2px 0;font-size:11.5px;color:#555}
  .legend span{display:inline-flex;align-items:center;gap:6px}

  .sources{font-size:11.5px;color:#555;line-height:1.7;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 16px}
  .sources b{color:#000}
  footer{margin-top:26px;font-size:11px;color:#8a8a8a;text-align:center;line-height:1.6}

  @media(max-width:820px){ .alarms,.sys{grid-template-columns:1fr} .clock .when{flex-basis:130px} }
  @media print{body{background:#fff} .alarm,.sysCard,.clock,.flow,table,.sources{break-inside:avoid}}
</style>
</head>
<body>
<div id="cc-supersede" style="background:#000;color:#fff;font:600 13px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:9px 42px 9px 16px;position:relative;text-align:center;letter-spacing:.01em">
  🎛️ This page is superseded by the <a href="../command/" style="color:#F7BE00;text-decoration:underline;font-weight:800">Retention Command Center</a> — scripts, journeys and automations now live there.
  <button type="button" aria-label="Dismiss" onclick="this.parentNode.style.display='none';try{localStorage.setItem('ccSupersedeDismissed','1')}catch(e){}" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:0;color:#fff;font-size:18px;line-height:1;cursor:pointer;padding:0 4px">&times;</button>
</div>
<script>try{if(localStorage.getItem('ccSupersedeDismissed'))document.getElementById('cc-supersede').style.display='none'}catch(e){}</script>
<div class="wrap">
  <header>
    <div class="o"><svg viewBox="-270 -185 3237 2226" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Planet Apparel" preserveAspectRatio="xMidYMid meet"><g transform="translate(0,1856) scale(0.1,-0.1)" fill="currentColor"><path d="M26172 18550 c-77 -11 -149 -33 -222 -71 -30 -15 -1319 -875 -2865 -1911 l-2810 -1884 -79 96 c-317 380 -621 695 -976 1011 -1352 1203 -2909 1899 -4679 2094 -587 64 -1288 72 -1861 20 -1460 -133 -2796 -615 -4049 -1462 -1429 -966 -2537 -2349 -3190 -3981 -566 -1416 -736 -3047 -481 -4602 151 -917 461 -1808 919 -2645 39 -71 70 -133 69 -137 -2 -3 -1279 -862 -2838 -1908 -2558 -1715 -2842 -1908 -2910 -1978 -270 -277 -263 -712 15 -988 84 -82 195 -145 311 -174 154 -40 355 -21 486 46 29 15 736 485 1571 1045 835 561 1520 1019 1522 1019 2 0 594 396 1315 880 721 484 1315 880 1319 880 4 0 48 -51 98 -113 607 -750 1346 -1387 2203 -1897 1047 -623 2169 -1022 3302 -1174 958 -129 2004 -93 2953 100 1473 301 2847 993 4000 2013 173 153 542 522 697 698 825 934 1454 2053 1803 3208 185 613 285 1156 347 1890 21 239 17 1108 -5 1365 -47 534 -129 1032 -249 1505 -22 88 -43 166 -47 173 -5 8 -201 -118 -632 -407 l-626 -420 28 -148 c102 -540 134 -934 126 -1546 -7 -498 -28 -754 -98 -1177 -200 -1216 -704 -2316 -1494 -3265 -391 -470 -873 -928 -1345 -1277 -918 -680 -1949 -1106 -3100 -1282 -593 -91 -1328 -112 -1950 -55 -1565 142 -2908 728 -4099 1788 -258 229 -777 780 -754 801 9 8 12267 8233 16338 10962 2200 1475 2468 1657 2535 1726 42 42 90 102 107 132 103 181 121 420 46 610 -60 149 -186 292 -320 363 -126 66 -293 96 -431 77z m-12062 -2035 c760 -63 1436 -220 2100 -487 945 -380 1771 -934 2476 -1660 138 -142 414 -455 414 -468 -1 -3 -397 -270 -882 -595 -484 -324 -3185 -2136 -6002 -4026 l-5121 -3436 -49 91 c-246 458 -483 1111 -604 1666 -126 572 -175 1046 -175 1675 0 412 14 652 59 1010 200 1588 886 2967 2059 4140 961 961 2052 1591 3290 1899 464 115 910 178 1495 210 146 8 767 -4 940 -19z"/></g></svg></div>
    <div class="crumb" id="crumb">Revenue House</div>
    <h1 id="title">Retention</h1>
    <div class="meta" id="hmeta"></div>
    <div class="sup" id="sup"></div>
  </header>

  <div id="app"><p style="padding:40px;text-align:center;color:#888">Loading the retention system…</p></div>

  <footer id="foot"></footer>
</div>

<script>
const B = { live:'LIVE', dry:'DRY-RUN', manual:'MANUAL', planned:'PLANNED', alarm:'ALARM' };
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const esc = s => (s==null?'':String(s)).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));

async function main(){
  let D;
  try{
    const r = await fetch('./status.json?_='+Math.floor(Date.now()/60000));
    D = await r.json();
  }catch(e){
    document.getElementById('app').innerHTML =
      '<p style="padding:30px;color:#b45309">Could not load <code>status.json</code>. '+
      'This page reads it live — open it via the deployed URL (github.io), not a local file:// path.</p>';
    return;
  }
  render(D);
}

function render(D){
  const m = D.meta||{};
  document.getElementById('crumb').textContent = m.parent||'Revenue House';
  document.getElementById('title').textContent = m.title||'Retention';
  document.getElementById('hmeta').innerHTML =
    'Updated <b>'+esc(m.updated)+'</b> &nbsp;·&nbsp; Join key: <b>'+esc(m.joinKey)+'</b>';
  if(m.supersedes){
    document.getElementById('sup').innerHTML =
      '<b style="color:var(--gold)">One source of truth.</b> Replaces the three old masters: '+
      m.supersedes.map(s=>'<span class="pill">'+esc(s)+'</span>').join('');
  }
  document.getElementById('foot').innerHTML =
    'Planet Apparel · Planet Sales › Retention · live system map · reads <code>status.json</code> · '+
    esc(m.howToMaintain||'')+'<br>join key = Printavo Customer ID (Sale 1068 ↔ Retention 1003)';

  const app = document.getElementById('app');
  app.innerHTML='';

  /* ── ALARMS ── */
  const alarms = D.alarms||[];
  const reds = alarms.filter(a=>a.level==='red'), ambers = alarms.filter(a=>a.level!=='red');
  const head = el('div','alarmHead');
  head.appendChild(el('h2','','🚨 Alarms'));
  if(reds.length) head.appendChild(el('span','alarmCount', reds.length+' red'));
  if(ambers.length) head.appendChild(el('span','alarmCount amber', ambers.length+' watch'));
  app.appendChild(head);
  const ag = el('div','alarms');
  alarms.forEach(a=>{
    const c = el('div','alarm '+(a.level==='red'?'red':''));
    c.innerHTML =
      '<div class="top"><span class="dot"></span>'+esc(a.title)+
        '<span class="lvl">'+(a.level==='red'?'RED':'WATCH')+'</span></div>'+
      '<div class="det">'+esc(a.detail)+'</div>'+
      '<div class="fix"><b>Fix:</b> '+esc(a.action)+
        (a.owner?'<span class="who">'+esc(a.owner)+'</span>':'')+'</div>';
    ag.appendChild(c);
  });
  app.appendChild(ag);

  /* ── SYSTEMS ── */
  app.appendChild(el('h2','','Three cadence systems <span class="sub">they run in parallel — and don\'t talk to each other</span>'));
  const sys = el('div','sys');
  (D.systems||[]).forEach(s=>{
    const cls = s.status==='live'?'':(s.status==='manual'?'manual':'unverified');
    const c = el('div','sysCard '+cls);
    c.innerHTML = '<h3><span class="letter">'+esc(s.id)+'</span>'+esc(s.name)+
      ' <span class="badge '+badgeCls(s.status)+'">'+statusLabel(s.status)+'</span></h3>'+
      '<p>'+esc(s.summary)+'</p>'+ (s.flag?'<span class="flag">⚠️ '+esc(s.flag)+'</span>':'');
    sys.appendChild(c);
  });
  app.appendChild(sys);

  /* ── CADENCE CLOCK ── */
  app.appendChild(el('h2','','Cadence clock <span class="sub">when each automation fires (Pacific)</span>'));
  const clock = el('div','clock');
  (D.cadence||[]).forEach(r=>{
    const row = el('div','row'+(r.dead?' dead':''));
    row.innerHTML = '<div class="when">'+esc(r.when)+'</div><div class="items">'+esc(r.items)+
      (r.note?'<span class="n">('+esc(r.note)+')</span>':'')+'</div>';
    clock.appendChild(row);
  });
  app.appendChild(clock);

  /* ── LIFECYCLE FLOW ── */
  app.appendChild(el('h2','','The flow <span class="sub">every customer\'s life, and what fires at each stage</span>'));
  const flow = el('div','flow');
  const spine = el('div','spine');
  const nodes = D.nodes||[];
  (D.stages||[]).forEach(st=>{
    const col = el('div','stageCol');
    const ink = st.ink||'#fff';
    const chip = el('div','stageChip');
    chip.style.background = st.color; chip.style.color = ink;
    chip.innerHTML = esc(st.name)+'<small style="color:'+(ink==='#000'?'#333':'inherit')+'">'+esc(st.sub)+'</small>';
    col.appendChild(chip);
    const autos = el('div','autos');
    nodes.filter(n=>n.stage===st.id).forEach(n=>autos.appendChild(nodeCard(n)));
    col.appendChild(autos);
    spine.appendChild(col);
  });
  flow.appendChild(spine);
  flow.appendChild(legend());
  app.appendChild(flow);

  /* ── TRIGGER TABLE ── */
  app.appendChild(el('h2','','Every trigger, named <span class="sub">the shared vocabulary</span>'));
  const tbl = el('table');
  tbl.innerHTML = '<tr><th style="width:20%">Automation</th><th style="width:30%">What it does</th>'+
    '<th style="width:15%">Fires when</th><th style="width:9%">Sys</th><th style="width:13%">n8n / where</th><th style="width:10%">Status</th></tr>';
  nodes.forEach(n=>{
    const tr = el('tr','sys'+esc(n.system));
    tr.innerHTML = '<td class="nmc">'+esc(n.name)+'</td><td>'+esc(n.what)+
      (n.next?'<br><span style="color:var(--dry);font-size:11px">→ '+esc(n.next)+'</span>':'')+'</td>'+
      '<td>'+esc(n.trigger)+'</td><td>'+esc(n.system)+'</td><td><code>'+esc(n.script)+'</code></td>'+
      '<td><span class="badge '+badgeCls(n.status)+'">'+statusLabel(n.status)+'</span></td>';
    tbl.appendChild(tr);
  });
  app.appendChild(tbl);

  /* ── SOURCES ── */
  if(D.sources){
    app.appendChild(el('h2','','Where this came from <span class="sub">the docs this page consolidates</span>'));
    const src = el('div','sources');
    src.innerHTML = (D.sources||[]).map(s=>'<div><b>'+esc(s.label)+'</b> — '+esc(s.path)+'</div>').join('');
    app.appendChild(src);
  }
}

function nodeCard(n){
  const c = el('div','node '+ (n.status==='dry'?'dry':n.status==='alarm'?'alarm':n.status==='manual'?'manual':''));
  c.innerHTML = '<div class="nm">'+esc(n.name)+
    ' <span class="b '+badgeCls(n.status)+'">'+statusLabel(n.status)+'</span>'+
    ' <span class="sy">'+esc(n.system)+'</span></div>'+
    '<div class="cad">⏱ '+esc(n.cadence)+' · '+esc(n.owner)+'</div>'+
    (n.next?'<div class="nx">→ '+esc(n.next)+'</div>':'');
  return c;
}
function legend(){
  const l = el('div','legend');
  l.innerHTML = ['live','dry','manual','planned','alarm'].map(s=>
    '<span><span class="badge '+badgeCls(s)+'">'+statusLabel(s)+'</span> '+legendText(s)+'</span>').join('');
  return l;
}
function badgeCls(s){return s==='live'?'live':s==='dry'?'dry':s==='manual'?'manual':s==='planned'?'planned':'alarm';}
function statusLabel(s){return {live:'LIVE',dry:'DRY-RUN',manual:'MANUAL',planned:'PLANNED',alarm:'ALARM',unverified:'UNVERIFIED'}[s]||s.toUpperCase();}
function legendText(s){return {live:'running now',dry:'built, writes nothing',manual:'done by hand',planned:'not built',alarm:'needs action'}[s]||'';}

main();
</script>
</body>
</html>
