<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planet Sales · Retention Command Center</title>
<style>
  :root{
    --gold:#F7BE00; --ink:#111; --line:#e2e2e6; --bg:#f4f4f5; --card:#fff;
    --live:#047857; --draft:#b45309; --manual:#475569; --planned:#2563eb; --off:#dc2626;
    --dry:#b45309; --alarm:#dc2626; --unver:#94a3b8; --amber:#d97706; --red:#dc2626;
    --mut:#6b7280;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;overflow-x:hidden;}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit}
  .wrap{max-width:1240px;margin:0 auto;padding:16px 18px 80px;}

  /* ── top nav bar (persistent) ── */
  .topbar{position:sticky;top:0;z-index:50;background:rgba(244,244,245,.94);
    backdrop-filter:saturate(1.4) blur(8px);display:flex;align-items:center;gap:10px;
    padding:10px 18px;border-bottom:1px solid var(--line);}
  .topbar .home,.topbar .srch{min-width:44px;min-height:44px;display:inline-flex;align-items:center;
    justify-content:center;background:var(--card);border:1px solid var(--line);border-radius:12px;
    font-size:19px;cursor:pointer;font-weight:800}
  .topbar .home:hover,.topbar .srch:hover{border-color:var(--gold)}
  .crumbbar{flex:1;font-size:12.5px;letter-spacing:.4px;color:var(--mut);font-weight:700;
    text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .crumbbar a{color:var(--mut)} .crumbbar a:hover{color:var(--ink)}
  .crumbbar b{color:var(--ink)}
  .fresh{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;
    padding:5px 10px;border-radius:999px;white-space:nowrap;text-transform:uppercase;letter-spacing:.4px}
  .fresh .fdot{width:9px;height:9px;border-radius:50%}
  .fresh.green{background:#ecfdf5;color:#047857} .fresh.green .fdot{background:#047857}
  .fresh.amber{background:#fffbeb;color:#b45309} .fresh.amber .fdot{background:#d97706}
  .fresh.red{background:#fef2f2;color:#dc2626} .fresh.red .fdot{background:#dc2626}

  /* ── header ── */
  header{background:var(--ink);color:#fff;border-radius:16px;padding:22px 26px;position:relative;margin-top:14px}
  header .o{position:absolute;top:18px;right:22px}
  header .o svg{height:24px;width:auto;color:var(--gold);display:block}
  .crumb{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold);font-weight:800}
  header h1{margin:5px 0 0;font-size:30px;letter-spacing:.3px;text-transform:uppercase;font-weight:800}
  header .sub{margin:9px 0 0;color:#cfcfcf;font-size:13px;line-height:1.6;max-width:640px}

  /* ── omnisearch ── */
  .omni{position:relative;margin:20px 0 8px}
  .omni input{width:100%;font-size:22px;font-weight:600;padding:20px 54px 20px 22px;border-radius:16px;
    border:2px solid var(--line);background:var(--card);outline:none;color:var(--ink)}
  .omni input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(247,190,0,.18)}
  .omni input::placeholder{color:#9aa2ac;font-weight:500}
  .omni .kbd{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:12px;color:#aab;
    border:1px solid var(--line);border-radius:7px;padding:3px 9px;font-weight:800;background:#fafafb}
  .omni .clr{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:20px;color:#889;
    cursor:pointer;background:none;border:0;display:none;min-width:34px;min-height:34px}

  /* ── home tiles ── */
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:14px 0 22px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 20px;
    cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:132px;transition:.12s;position:relative}
  .tile:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.06)}
  .tile .ic{font-size:30px}
  .tile .lab{font-size:19px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
  .tile .one{font-size:13px;color:var(--mut);line-height:1.4}
  .tile .cnt{position:absolute;top:18px;right:20px;font-size:26px;font-weight:800;color:var(--ink)}
  .tile .cnt small{font-size:12px;color:var(--mut);font-weight:700;display:block;text-align:right}

  .homefoot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;font-size:13px;color:var(--mut)}
  .homefoot a.edit{background:var(--gold);color:#000;font-weight:800;padding:9px 16px;border-radius:10px;
    font-size:13px;white-space:nowrap}
  .homefoot a.edit:hover{filter:brightness(.95)}

  /* ── section heads ── */
  h2.sec{font-size:14px;text-transform:uppercase;letter-spacing:1.2px;color:#333;margin:26px 0 12px;
    border-bottom:2px solid var(--line);padding-bottom:7px;font-weight:800}
  h2.sec .sub{text-transform:none;letter-spacing:0;font-weight:500;color:#8a8a8a;font-size:12.5px;margin-left:8px}

  /* ── status chips ── */
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;border-radius:999px;
    padding:3px 10px;color:#fff;white-space:nowrap;letter-spacing:.3px}
  .chip.autosend{background:var(--live)} .chip.autodraft{background:var(--draft)}
  .chip.manual{background:var(--manual)} .chip.planned{background:var(--planned)} .chip.off{background:var(--off)}
  .chip.ghost{background:#eef0f2;color:#475569}
  .hdot{display:inline-block;width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 3px rgba(0,0,0,.05)}
  .hdot.live{background:var(--live)} .hdot.dry{background:var(--dry)} .hdot.alarm{background:var(--alarm)}
  .hdot.unverified{background:var(--unver)} .hdot.na{background:#d1d5db}
  .sysbadge{font-size:9.5px;font-weight:800;color:#475569;border:1px solid var(--line);border-radius:5px;
    padding:1px 7px;text-transform:uppercase;letter-spacing:.4px;background:#fafafb}
  .avatar{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#334155;
    background:#f1f5f9;border-radius:999px;padding:3px 10px 3px 4px}
  .avatar .ini{width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-size:10px;
    display:inline-flex;align-items:center;justify-content:center;font-weight:800}

  /* ── filter chips ── */
  .filters{display:flex;flex-wrap:wrap;gap:9px;margin:2px 0 16px}
  .fchip{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:9px 16px;
    font-size:13px;font-weight:700;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;gap:6px}
  .fchip:hover{border-color:#c9c9cf}
  .fchip.on{background:var(--gold);border-color:var(--gold);color:#000}
  .fchip .n{font-size:11px;color:var(--mut);font-weight:800}
  .fchip.on .n{color:#000}

  /* ── card grid ── */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .ecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 17px;cursor:pointer;
    display:flex;flex-direction:column;gap:9px;min-height:120px;transition:.12s}
  .ecard:hover{border-color:var(--gold);box-shadow:0 5px 16px rgba(0,0,0,.05);transform:translateY(-2px)}
  .ecard .nm{font-size:16px;font-weight:800;line-height:1.2}
  .ecard .cd{font-size:11.5px;color:var(--mut);font-weight:700}
  .ecard .subj{font-size:13px;color:#374151;line-height:1.4;flex:1}
  .ecard .row{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:auto}
  .ecard .cad{font-size:11px;font-weight:700;color:#7c4a03;background:#fff8eb;border:1px solid #fde3a7;
    border-radius:6px;padding:2px 8px}
  .ecard.gap{border-style:dashed;border-color:#f0c14b;background:#fffdf5}
  .ecard.gap .nm{color:#7c4a03}
  .gaptag{font-size:10.5px;font-weight:800;color:#b45309;background:#fef3c7;border-radius:6px;padding:2px 8px;text-transform:uppercase}

  /* ── detail: email frame ── */
  .detail{display:grid;grid-template-columns:1fr;gap:16px}
  @media(min-width:900px){.detail{grid-template-columns:1.7fr 1fr}}
  .frame{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .frame .fh{background:#fbfbfc;border-bottom:1px solid var(--line);padding:16px 20px}
  .frame .fh .ln{display:flex;gap:10px;font-size:13.5px;padding:3px 0;line-height:1.5;color:#374151}
  .frame .fh .ln .k{width:64px;color:var(--mut);font-weight:700;flex:0 0 auto}
  .frame .fh .ln .v{font-weight:600}
  .frame .fh .subj{font-size:20px;font-weight:800;margin-top:8px;line-height:1.3}
  .frame .body{padding:22px 24px;font-size:16px;line-height:1.68;color:#1f2430;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .frame .body p{margin:0 0 15px}
  .frame .body p:last-child{margin-bottom:0}
  .mg{background:rgba(247,190,0,.32);border-radius:4px;padding:0 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  .mg.raw{background:#eef0f2;color:#475569;font-weight:700}
  .frame iframe{width:100%;border:0;background:#fff;min-height:340px;display:block}
  .frametoggle{display:flex;gap:9px;align-items:center;padding:12px 20px;border-top:1px solid var(--line);
    background:#fbfbfc;flex-wrap:wrap}
  .togbtn{font-size:12.5px;font-weight:700;border:1.5px solid var(--line);background:#fff;border-radius:9px;
    padding:8px 13px;cursor:pointer;min-height:40px}
  .togbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  .meta-side{display:flex;flex-direction:column;gap:14px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .panel h3{margin:0 0 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);font-weight:800}
  .panel .fires{font-size:14px;line-height:1.5;color:#1f2430}
  .linklist{display:flex;flex-direction:column;gap:8px}
  .lnk{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600;background:#f7f7f9;
    border:1px solid var(--line);border-radius:10px;padding:11px 13px;cursor:pointer;min-height:44px}
  .lnk:hover{border-color:var(--gold);background:#fffdf3}
  .lnk .ar{margin-left:auto;color:#b0b0b8;font-weight:800}
  .actions{display:flex;gap:10px;flex-wrap:wrap}
  .btn{font-size:14px;font-weight:800;border-radius:11px;padding:12px 18px;cursor:pointer;min-height:46px;border:0}
  .btn.primary{background:var(--gold);color:#000} .btn.primary:hover{filter:brightness(.96)}
  .btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)} .btn.ghost:hover{border-color:#c9c9cf}
  .sheetnote{font-size:11.5px;color:var(--mut);margin-top:8px;line-height:1.5}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;color:#475569;
    background:#f1f5f9;border-radius:4px;padding:1px 6px}

  /* ── call card ── */
  .opener{background:var(--ink);color:#fff;border-radius:16px;padding:26px 28px;font-size:22px;line-height:1.5;font-weight:600}
  .opener .mg{background:rgba(247,190,0,.42);color:#fff}
  .talk{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
  .talk li{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px 15px;font-size:15px;
    line-height:1.5;display:flex;gap:11px}
  .talk li .bx{width:20px;height:20px;border-radius:6px;border:2px solid #cbd0d6;flex:0 0 auto;margin-top:2px}
  .branch{background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .branch summary{cursor:pointer;padding:13px 15px;font-weight:700;font-size:14.5px;list-style:none;display:flex;gap:9px;align-items:center}
  .branch summary::-webkit-details-marker{display:none}
  .branch summary::before{content:"▸";color:var(--gold);font-weight:800}
  .branch[open] summary::before{content:"▾"}
  .branch .bc{padding:0 15px 14px 33px;font-size:14px;line-height:1.55;color:#374151}

  /* ── journeys ── */
  .jpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .jbig{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 22px;cursor:pointer;
    display:flex;flex-direction:column;gap:8px;min-height:120px}
  .jbig:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.06)}
  .jbig .ic{font-size:28px}.jbig .lab{font-size:20px;font-weight:800;text-transform:uppercase}
  .jbig .one{font-size:13px;color:var(--mut)}
  .jbig.disabled{opacity:.5;cursor:not-allowed}
  .summ{background:var(--ink);color:#fff;border-radius:14px;padding:18px 22px;font-size:17px;line-height:1.55;margin-bottom:16px}
  .summ b{color:var(--gold)}
  .timeline{position:relative;padding-left:26px}
  .timeline::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:2px;background:var(--line)}
  .tentry{position:relative;margin-bottom:14px}
  .tentry::before{content:"";position:absolute;left:-22px;top:20px;width:12px;height:12px;border-radius:50%;
    background:#fff;border:3px solid var(--gold)}
  .tcard{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .tcard summary{cursor:pointer;padding:15px 17px;list-style:none;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
  .tcard summary::-webkit-details-marker{display:none}
  .tcard .when{font-size:12px;font-weight:800;color:#7c4a03;background:#fff8eb;border:1px solid #fde3a7;
    border-radius:6px;padding:3px 9px;white-space:nowrap}
  .tcard .tnm{font-size:16px;font-weight:800}
  .tcard .cond{flex-basis:100%;font-size:13px;color:var(--mut);line-height:1.45}
  .tcard .ev{flex-basis:100%;font-size:12.5px;color:#7c4a03;background:#fffaf0;border:1px dashed #f0c14b;
    border-radius:7px;padding:7px 10px;line-height:1.45;font-weight:600}
  .tcard .supp{flex-basis:100%;font-size:12px;color:#475569;line-height:1.4}
  .texp{padding:0 17px 16px;border-top:1px solid var(--line)}

  /* ── automations board ── */
  .board{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;align-items:start}
  .col{background:#fafafb;border:1px solid var(--line);border-radius:14px;padding:12px}
  .col h4{margin:2px 4px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;font-weight:800;
    display:flex;align-items:center;gap:8px}
  .col h4 .n{margin-left:auto;font-size:11px;color:var(--mut)}
  .acard{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px 14px;margin-bottom:10px;cursor:pointer}
  .acard:hover{border-color:var(--gold)}
  .acard .anm{font-size:14.5px;font-weight:800;line-height:1.25;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .acard .meta2{font-size:12px;color:#475569;line-height:1.5;margin-top:7px}
  .acard .meta2 b{color:#1f2430}
  .acard .foot{margin-top:9px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--mut)}
  .aiohead{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin-bottom:14px;
    display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px;color:#374151}
  .aiohead .mapbtn{margin-left:auto;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:9px 14px;
    font-weight:800;font-size:12.5px;color:#1f2430}

  /* ── lifecycle ── */
  .stages{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch;margin-bottom:8px}
  .stnode{flex:1;min-width:150px;background:var(--card);border:1px solid var(--line);border-radius:13px;
    padding:16px 14px;cursor:pointer;text-align:center;transition:.12s;position:relative}
  .stnode:hover{border-color:var(--gold);transform:translateY(-2px)}
  .stnode.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(247,190,0,.2)}
  .stnode .sname{font-size:16px;font-weight:800;text-transform:uppercase}
  .stnode .sord{position:absolute;top:9px;left:12px;font-size:11px;color:#c4c4cc;font-weight:800}
  .stnode .sown{font-size:11px;color:var(--mut);margin-top:5px;line-height:1.3}
  .stnode .arrow{color:#c4c4cc;font-size:18px}
  .stpanel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-top:14px}
  .rule{display:flex;gap:12px;margin:10px 0;font-size:14.5px;line-height:1.5}
  .rule .tag{flex:0 0 auto;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;
    border-radius:6px;padding:4px 9px;height:fit-content}
  .rule .tag.in{background:#ecfdf5;color:#047857} .rule .tag.out{background:#fef2f2;color:#dc2626}

  /* ── validation ── */
  .vbanner{background:#fef2f2;border:1px solid #fca5a5;color:#991b1b;border-radius:12px;padding:14px 18px;
    font-size:14px;font-weight:600;margin-bottom:16px;display:flex;gap:10px;align-items:center}
  .vbanner.ok{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}
  .vrow{background:var(--card);border:1px solid var(--line);border-left:5px solid #f0c14b;border-radius:11px;
    padding:14px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .vrow .vnm{font-size:15px;font-weight:800}
  .vrow .vcd{font-size:11.5px;color:var(--mut);font-weight:700}
  .vrow .vwhy{flex-basis:100%;font-size:13px;color:#374151;line-height:1.45}
  .vrow .vlink{margin-left:auto;font-size:12.5px;font-weight:800;color:#1f2430;background:#fff8eb;border:1px solid #fde3a7;
    border-radius:8px;padding:8px 13px}

  /* ── search results ── */
  .sgroup{margin-bottom:22px}
  .sgroup h3{font-size:12.5px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);font-weight:800;
    margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .sgroup h3 .n{color:#c4c4cc}
  .sres{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px 15px;margin-bottom:9px;
    cursor:pointer;display:flex;gap:12px;align-items:center}
  .sres:hover{border-color:var(--gold)}
  .sres .sic{font-size:20px;flex:0 0 auto}
  .sres .stx{flex:1;min-width:0}
  .sres .stt{font-size:15px;font-weight:800;line-height:1.2}
  .sres .sct{font-size:12.5px;color:var(--mut);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .showall{font-size:12.5px;font-weight:800;color:#1f2430;cursor:pointer;padding:8px 2px;display:inline-block}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:40px 24px;text-align:center;color:var(--mut)}
  .empty .big{font-size:19px;font-weight:800;color:#1f2430;margin-bottom:6px}

  footer{margin-top:34px;font-size:11.5px;color:#9a9aa2;text-align:center;line-height:1.7;
    border-top:1px solid var(--line);padding-top:18px}

  @media(max-width:820px){
    .tiles{grid-template-columns:1fr 1fr} .board{grid-template-columns:1fr}
    header h1{font-size:24px} .omni input{font-size:18px}
  }
  @media(max-width:520px){ .tiles{grid-template-columns:1fr} }

  @media print{
    body{background:#fff}
    .topbar,.omni,.actions,.frametoggle{display:none!important}
    .ecard,.frame,.panel,.acard,.stpanel,.tcard,.vrow{break-inside:avoid}
    .detail{grid-template-columns:1fr}
    .grid{display:block} .grid .ecard{margin-bottom:10px}
    details{display:block!important} details .texp,.branch .bc{display:block!important}
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="home" role="button" tabindex="0" title="Home" onclick="location.hash='#/'">⌂</div>
  <div class="srch" role="button" tabindex="0" title="Search ( / )" onclick="goSearch()">⌕</div>
  <div class="crumbbar" id="crumbbar">Command Center</div>
  <div class="fresh amber" id="fresh"><span class="fdot"></span><span id="freshtxt">Loading…</span></div>
</div>

<div class="wrap">

<script>
"use strict";
/* ─────────────────────────── constants & helpers ─────────────────────────── */
const ENDPOINT = "https://primary-production-079f9.up.railway.app/webhook/command-center-data";
const FETCH_TIMEOUT = 3000;
const LS_KEY = "cc-lastgood-v1";

const AUTO = {
  "auto-send":{cls:"autosend", ic:"🟢", label:"AUTO-SEND"},
  "auto-draft":{cls:"autodraft", ic:"✍️", label:"AUTO-DRAFT"},
  "manual":{cls:"manual", ic:"👤", label:"MANUAL"},
  "planned":{cls:"planned", ic:"🕓", label:"PLANNED"},
  "off":{cls:"off", ic:"⛔", label:"OFF"}
};
const AUTO_ORDER = ["auto-send","auto-draft","manual","planned","off"];

let DATA = null, IDX = null, SOURCE = null, SOURCE_TIME = null;

const esc = s => (s==null?"":String(s)).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const $ = id => document.getElementById(id);

function slugify(code){return String(code).toLowerCase().replace(/^[\^\/]+/,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");}
function aliasStr(a){ return Array.isArray(a)?a.join(" "):(a||""); }
function aliasArr(a){ return Array.isArray(a)?a:String(a||"").split(",").map(x=>x.trim()).filter(Boolean); }
function initials(name){const p=String(name||"").trim().split(/\s+/); return ((p[0]||"?")[0]+(p[1]?p[1][0]:"")).toUpperCase();}

function autoChip(level){
  const a = AUTO[level]; if(!a) return "";
  return '<span class="chip '+a.cls+'">'+a.ic+' '+a.label+'</span>';
}
function healthDot(h){
  if(!h||h==="n/a") return "";
  const lab={live:"Live",dry:"Dry-run",alarm:"Alarm",unverified:"Unverified"}[h]||h;
  return '<span class="hdot '+esc(h)+'" title="'+esc(lab)+'"></span>';
}

/* owner detection from mailbox/rule text */
function ownersOf(sc){
  const t = ((sc.fromMailbox||"")+" "+(sc.sentByRule||"")).toLowerCase();
  const out = [];
  if(/shara|bandanas@|box owner/.test(t)) out.push("Shara");
  if(/cortney|team@|box owner/.test(t)) out.push("Cortney");
  if(/kelly/.test(t)) out.push("Kelly");
  if(/holly/.test(t)) out.push("Holly");
  return out.length?[...new Set(out)]:["PM"];
}
function primaryOwner(sc){
  const fm=(sc.fromMailbox||"");
  const m = fm.match(/\(([^)]+)\)/); // "(Cortney)"
  if(m) return m[1].split("/")[0].trim();
  if(/bandanas@/i.test(fm)) return "Shara";
  if(/team@/i.test(fm)) return "Cortney";
  if(/box owner/i.test(fm)) return "Box owner";
  return ownersOf(sc)[0];
}
function mailboxOf(sc){
  const m=(sc.fromMailbox||"").match(/[\w.+-]+@[\w.-]+/);
  if(m) return m[0];
  if(/bandanas@/i.test(sc.fromMailbox)) return "bandanas@planetapparel.com";
  return "team@planetapparel.com";
}

/* ─────────────────────────── index build ─────────────────────────── */
function buildIndex(D){
  const byCode = {}, slugMap = {};
  (D.scripts||[]).forEach(s=>{byCode[s.code]=s; slugMap[slugify(s.code)]=s.code;});
  (D.gaps||[]).forEach(g=>{ if(g.kind==="script"){ slugMap[slugify(g.code)]=g.code; }});
  const gapByCode={}; (D.gaps||[]).forEach(g=>gapByCode[g.code]=g);

  const tpById = {}; (D.touchpoints||[]).forEach(t=>tpById[t.id]=t);
  const fieldsByScript = {};
  (D.script_fields||[]).forEach(f=>{ (fieldsByScript[f.scriptCode]=fieldsByScript[f.scriptCode]||[]).push(f); });

  // touchpoint_scripts joins
  const tsByScript = {}, tsByTouchpoint = {};
  (D.touchpoint_scripts||[]).forEach(j=>{
    (tsByScript[j.scriptCode]=tsByScript[j.scriptCode]||[]).push(j);
    (tsByTouchpoint[j.touchpointId]=tsByTouchpoint[j.touchpointId]||[]).push(j);
  });

  // journeys grouped
  const journeysByType = {};
  (D.journeys||[]).forEach(j=>{ (journeysByType[j.customerType]=journeysByType[j.customerType]||[]).push(j); });
  Object.values(journeysByType).forEach(arr=>arr.sort((a,b)=>(+a.stepOrder||0)-(+b.stepOrder||0)));

  // derived script send level from memberships
  function levelOf(code){
    const rows = tsByScript[code]||[];
    let best = null;
    rows.forEach(r=>{
      let lvl = r.sendMode;
      if(lvl==="task") lvl="manual";
      if(!AUTO[lvl]){ const tp=tpById[r.touchpointId]; lvl = tp?tp.autoLevel:"manual"; }
      if(!AUTO[lvl]) lvl="manual";
      if(best===null || AUTO_ORDER.indexOf(lvl) < AUTO_ORDER.indexOf(best)) best = lvl;
    });
    return best || "manual";
  }
  // derived cadence tag from journeys
  function cadenceOf(code){
    const tpIds = new Set((tsByScript[code]||[]).map(r=>r.touchpointId));
    let hit=null;
    (D.journeys||[]).some(j=>{ if(tpIds.has(j.touchpointId)){ hit=j; return true;} return false;});
    return hit ? {label:hit.timingLabel, tier:hit.tier} : null;
  }

  // search index
  const searchIdx = [];
  (D.scripts||[]).forEach(s=>{
    const grp = s.channel==="call" ? "Calls" : "Scripts";
    searchIdx.push({
      type: s.channel==="call"?"call":"script", group:grp, ic:s.channel==="call"?"📞":"📧",
      id:s.code, title:s.name, code:s.code,
      context: s.channel==="call" ? (s.firesWhen||"") : (s.subject||s.firesWhen||""),
      status: autoChip(levelOf(s.code)),
      route: (s.channel==="call"?"#/calls/":"#/scripts/")+slugify(s.code),
      hay: [s.code, s.name, aliasStr(s.aliases), s.subject, s.bodyText, s.notes].join(" ").toLowerCase(),
      name:(s.name||"").toLowerCase(), subj:(s.subject||"").toLowerCase()
    });
  });
  (D.gaps||[]).filter(g=>g.kind==="script").forEach(g=>{
    const isCall = g.channel==="call";
    searchIdx.push({
      type:"gap", group:isCall?"Calls":"Scripts", ic:isCall?"📞":"📧", id:g.code, title:g.name, code:g.code,
      context:"Gap · "+gapReason(g),
      status:'<span class="chip planned">🕓 '+esc(g.publishStatus.toUpperCase())+'</span>',
      route:(isCall?"#/calls/":"#/scripts/")+slugify(g.code),
      hay:[g.code,g.name,gapReason(g),g.notes].join(" ").toLowerCase(), name:(g.name||"").toLowerCase(), subj:""
    });
  });
  (D.touchpoints||[]).forEach(t=>{
    searchIdx.push({
      type:"touchpoint", group:"Automations", ic:"⚙️", id:t.id, title:t.name, code:t.workflowId||t.id,
      context:(t.trigger||"")+(t.workflowId?" · "+t.workflowId:""),
      status: autoChip(t.autoLevel)+" "+healthDot(t.healthStatus),
      route:"#/automations/"+t.id,
      hay:[t.name,t.trigger,t.system,t.workflowId,t.notes,t.schedule,t.autoLevel,t.healthStatus].join(" ").toLowerCase(),
      name:(t.name||"").toLowerCase(), subj:""
    });
  });
  Object.keys(journeysByType).forEach(ct=>{
    const arr=journeysByType[ct];
    searchIdx.push({
      type:"journey", group:"Journeys", ic:"🧭", id:ct, title:journeyLabel(ct), code:ct,
      context: arr.map(j=>j.timingLabel).slice(0,4).join(" · "),
      status:"", route:"#/journeys/"+ct,
      hay:[ct, journeyLabel(ct), arr.map(j=>j.timingLabel+" "+j.condition).join(" ")].join(" ").toLowerCase(),
      name:journeyLabel(ct).toLowerCase(), subj:""
    });
  });
  (D.stages||[]).forEach(st=>{
    searchIdx.push({
      type:"stage", group:"Stages", ic:"🔄", id:st.id, title:st.name, code:st.id,
      context:(st.automationOwner||""),
      status:"", route:"#/lifecycle/"+st.id,
      hay:[st.name,st.id,st.entryRule,st.exitRule,st.automationOwner,st.northStarAnchor].join(" ").toLowerCase(),
      name:(st.name||"").toLowerCase(), subj:""
    });
  });
  (D.behavior_triggers||[]).forEach(b=>{
    searchIdx.push({
      // Folded under Automations (no non-spec sixth group); row labelled "behavior signal".
      type:"behavior", group:"Automations", ic:"📡", id:b.trigger, title:"On "+b.trigger, code:b.trigger,
      context:"Behavior signal · "+(b.recencyRule||"tiered response, never auto-reply"), status:"", route:"#/automations",
      hay:[b.trigger,b.responseT1,b.responseT2,b.responseT3,b.recencyRule,b.throttle].join(" ").toLowerCase(),
      name:("on "+b.trigger).toLowerCase(), subj:""
    });
  });

  return {byCode,slugMap,gapByCode,tpById,fieldsByScript,tsByScript,tsByTouchpoint,journeysByType,searchIdx,levelOf,cadenceOf};
}

function journeyLabel(ct){
  const map={"at-risk":"At-Risk","inactive":"Inactive","lost":"Lost"};
  if(map[ct]) return map[ct]+" journey";
  const m=ct.match(/^(bandana|apparel|promo)-(t\d)$/);
  if(m) return m[1].charAt(0).toUpperCase()+m[1].slice(1)+" "+m[2].toUpperCase();
  return ct;
}

/* ─────────────────────────── data loading ─────────────────────────── */
async function fetchWithTimeout(url, ms){
  const ctrl = new AbortController();
  const to = setTimeout(()=>ctrl.abort(), ms);
  try{
    const r = await fetch(url, {signal:ctrl.signal, cache:"no-store"});
    clearTimeout(to);
    if(!r.ok) throw new Error("HTTP "+r.status);
    return await r.json();
  } finally { clearTimeout(to); }
}
function validShape(d){ return d && Array.isArray(d.scripts) && Array.isArray(d.touchpoints) && d.meta; }
// An unhealthy cold rebuild can return a shape-valid but EMPTY 200 payload; that must
// not be treated as authoritative or it suppresses the sessionStorage/sample fallback.
function authoritative(d){ return validShape(d) && d.scripts.length > 0 && d.touchpoints.length > 0; }

async function load(){
  // 1. primary endpoint (3s hard timeout)
  try{
    const d = await fetchWithTimeout(ENDPOINT, FETCH_TIMEOUT);
    if(authoritative(d)){
      SOURCE="live"; SOURCE_TIME=Date.now();
      try{ sessionStorage.setItem(LS_KEY, JSON.stringify({t:SOURCE_TIME, d})); }catch(e){}
      return d;
    }
  }catch(e){ /* fall through */ }
  // 2. sessionStorage last-good
  try{
    const raw = sessionStorage.getItem(LS_KEY);
    if(raw){ const o=JSON.parse(raw); if(authoritative(o.d)){ SOURCE="cache"; SOURCE_TIME=o.t; return o.d; } }
  }catch(e){}
  // 3. static sample-data mirror
  try{
    const d = await fetchWithTimeout("./sample-data.json", FETCH_TIMEOUT);
    if(authoritative(d)){
      SOURCE="sample";
      SOURCE_TIME = d.meta && d.meta.updated ? Date.parse(d.meta.updated+"T00:00:00") : Date.now();
      return d;
    }
  }catch(e){}
  // 4. unavailable
  SOURCE="none"; SOURCE_TIME=null;
  return null;
}

// Parse a server timestamp: epoch ms/seconds, ISO string, or a bare YYYY-MM-DD date.
function parseTime(v){
  if(v==null) return null;
  if(typeof v==="number") return v>1e12?v:v*1000;
  const s=String(v).trim(); if(!s) return null;
  if(/^\d+$/.test(s)){ const n=+s; return n>1e12?n:n*1000; }
  const ms=Date.parse(/^\d{4}-\d{2}-\d{2}$/.test(s)? s+"T00:00:00" : s);
  return isNaN(ms)?null:ms;
}
function relTime(ms){
  if(ms==null) return "";
  const ageH=(Date.now()-ms)/36e5;
  if(ageH<1) return "just now";
  if(ageH<24) return Math.round(ageH)+"h ago";
  return Math.round(ageH/24)+"d ago";
}
// Freshness is derived from PAYLOAD META (generatedAt/servedAt/stale/servedFrom/lastRebuildOk),
// not fetch time. Defensive against both old (no staleness meta) and new n8n shapes.
function renderFreshness(){
  const b=$("fresh"), t=$("freshtxt");
  b.title="";
  if(SOURCE==="none"){ b.className="fresh red"; t.textContent="Data unavailable"; return; }
  const meta=(DATA&&DATA.meta)||{};

  // Built-in offline sample → always an explicit, non-live badge.
  if(SOURCE==="sample"){
    b.className="fresh amber"; t.textContent="Offline sample";
    b.title="Showing the built-in sample snapshot — not live data.";
    return;
  }

  // Prefer server-declared generation time; fall back to fetch time only when absent.
  const genTime = parseTime(meta.generatedAt) || parseTime(meta.servedAt) || SOURCE_TIME;
  const ageH = genTime!=null ? (Date.now()-genTime)/36e5 : null;
  const when = genTime!=null ? relTime(genTime) : "";

  const rebuildFailed = meta.lastRebuildOk===false;
  const stale = meta.stale===true;
  const servedCache = SOURCE==="cache" || meta.servedFrom==="cache" || meta.servedFrom==="lastGood";

  let cls, txt;
  if(rebuildFailed){
    cls="red"; txt="Data may be out of date"+(when?" · "+when:"");
    b.title="Latest background rebuild failed — showing last known-good data.";
  } else if(stale || (ageH!=null && ageH>=24)){
    cls="amber"; txt="Data may be out of date"+(when?" · "+when:"");
    b.title = stale ? "Server marked this payload stale." : "Data is over a day old.";
  } else {
    cls = (ageH!=null && ageH>=1) ? "amber" : "green";
    txt = (servedCache?"Cached":"Live")+(when?" · "+when:"");
    b.title = servedCache ? "Served from cache, within the freshness window." : "Live data.";
  }
  b.className="fresh "+cls;
  t.textContent=txt;
}

/* ─────────────────────────── router ─────────────────────────── */
function safeDecode(s){
  // Invalid percent-encoding (e.g. "%E0%A4%A") throws in decodeURIComponent.
  // Treat malformed input as literal text so routing never breaks before route()'s try/catch.
  try{ return decodeURIComponent(String(s)); }catch(e){ return String(s); }
}
function parseHash(){
  let h = location.hash.replace(/^#\/?/,"");
  const parts = h.split("/").filter(x=>x!=="");
  return parts.map(safeDecode);
}
function setCrumb(trail){
  // trail = [[label,hash], ...] last is current (bold, no link)
  const bar = $("crumbbar"); bar.innerHTML="";
  trail.forEach((seg,i)=>{
    if(i>0) bar.appendChild(document.createTextNode("  ›  "));
    if(i<trail.length-1 && seg[1]){
      const a=el("a"); a.textContent=seg[0]; a.href=seg[1]; bar.appendChild(a);
    } else {
      const b=el("b"); b.textContent=seg[0]; bar.appendChild(b);
    }
  });
}
function nav(hash){ location.hash = hash; }
function goSearch(){ if(location.hash!=="#/" && location.hash!=="") location.hash="#/"; setTimeout(()=>{const i=$("omniInput"); if(i){i.focus();}},60); }

function route(){
  if(!DATA){ return; }
  const app=$("app"); app.innerHTML="";
  window.scrollTo(0,0);
  const p = parseHash();
  const seg0 = p[0]||"";
  try{
    if(seg0===""){ renderHome(app); }
    else if(seg0==="scripts" && p[1]){ renderScriptDetail(app, p[1], "scripts"); }
    else if(seg0==="scripts"){ renderScriptsGrid(app, "email"); }
    else if(seg0==="calls" && p[1]){ renderScriptDetail(app, p[1], "calls"); }
    else if(seg0==="calls"){ renderScriptsGrid(app, "call"); }
    else if(seg0==="journeys" && p[1]){ renderJourneyTimeline(app, p[1]); }
    else if(seg0==="journeys"){ renderJourneysHome(app); }
    else if(seg0==="automations" && p[1]){ renderAutomationDetail(app, p[1]); }
    else if(seg0==="automations"){ renderAutomations(app); }
    else if(seg0==="lifecycle" && p[1]){ renderLifecycle(app, p[1]); }
    else if(seg0==="lifecycle"){ renderLifecycle(app, null); }
    else if(seg0==="search"){ renderSearchScreen(app, p[1]||""); }
    else if(seg0==="validation"){ renderValidation(app); }
    else { renderHome(app); }
  }catch(err){
    console.error(err);
    app.appendChild(el("div","empty",'<div class="big">Something went sideways</div><div>'+esc(err.message)+'</div>'));
  }
}

/* ─────────────────────────── HOME ─────────────────────────── */
function renderHome(app){
  setCrumb([["Command Center",null]]);
  // header
  const hd = el("header");
  hd.innerHTML = OSVG +
    '<div class="crumb">Planet Sales › Revenue House</div>'+
    '<h1>Retention Command Center</h1>'+
    '<div class="sub">Every word Planet Apparel says to a customer through retention — every email, every call, every automation. Search it, or tap in.</div>';
  app.appendChild(hd);

  // omnisearch
  const omni = el("div","omni");
  omni.innerHTML =
    '<input id="omniInput" type="text" autocomplete="off" spellcheck="false" '+
    'placeholder="Search a script, a customer moment, an automation…">'+
    '<span class="kbd" id="omniKbd">/</span>'+
    '<button class="clr" id="omniClr" title="Clear">✕</button>';
  app.appendChild(omni);

  const results = el("div","",""); results.id="omniResults"; app.appendChild(results);
  const tilesWrap = el("div",""); tilesWrap.id="homeTiles"; app.appendChild(tilesWrap);

  const emailN = DATA.scripts.filter(s=>s.channel==="email").length;
  const callN = DATA.scripts.filter(s=>s.channel==="call").length;
  const journeyN = Object.keys(IDX.journeysByType).length;
  const autoLiveN = DATA.touchpoints.filter(t=>t.healthStatus==="live").length;
  const stageN = DATA.stages.length;
  const tiles=[
    {ic:"📧",lab:"Scripts",one:"Every email we send",cnt:emailN,csub:"live",hash:"#/scripts"},
    {ic:"📞",lab:"Calls",one:"Talking points for the phone",cnt:callN,csub:"live",hash:"#/calls"},
    {ic:"🧭",lab:"Journeys",one:"What a customer hears, in order",cnt:journeyN,csub:"paths",hash:"#/journeys"},
    {ic:"⚙️",lab:"Automations",one:"What fires on its own",cnt:autoLiveN,csub:"live",hash:"#/automations"},
    {ic:"🔄",lab:"Lifecycle",one:"NEW → LOST, and what fires",cnt:stageN,csub:"stages",hash:"#/lifecycle"}
  ];
  const tg = el("div","tiles");
  tiles.forEach(t=>{
    const c = el("div","tile");
    c.innerHTML = '<div class="cnt">'+t.cnt+'<small>'+t.csub+'</small></div>'+
      '<div class="ic">'+t.ic+'</div><div class="lab">'+t.lab+'</div><div class="one">'+esc(t.one)+'</div>';
    c.onclick=()=>nav(t.hash);
    tg.appendChild(c);
  });
  tilesWrap.appendChild(tg);

  // footer strip
  const foot = el("div","homefoot");
  const upd = DATA.meta && DATA.meta.updated ? DATA.meta.updated : "—";
  const gapsN=(DATA.gaps||[]).length;
  const fInfo=el("div");
  fInfo.innerHTML = 'Scripts updated <b style="color:#1f2430">'+esc(upd)+'</b>'+
    ' · release v'+esc((DATA.meta&&DATA.meta.releaseVersion)||"1")+
    ' · '+DATA.scripts.length+' live scripts · ';
  const vLink=el("a","","🚦 "+gapsN+" gaps →");
  vLink.href="#/validation"; vLink.style.fontWeight="800"; vLink.style.color="#b45309";
  fInfo.appendChild(vLink);
  foot.appendChild(fInfo);
  const edit = el("a","edit","Edit scripts →");
  edit.href = sheetUrl(); edit.target="_blank"; edit.rel="noopener noreferrer";
  foot.appendChild(edit);
  app.appendChild(foot);

  // wire search
  const input=$("omniInput"), clr=$("omniClr"), kbd=$("omniKbd");
  input.addEventListener("input", ()=>{
    const q=input.value.trim();
    clr.style.display = q?"inline-flex":"none"; kbd.style.display=q?"none":"inline-block";
    if(q){ tilesWrap.style.display="none"; foot.style.display="none"; renderSearch(results, q); }
    else { tilesWrap.style.display=""; foot.style.display=""; results.innerHTML=""; }
  });
  input.addEventListener("keydown", e=>{
    if(e.key==="Escape"){ input.value=""; input.dispatchEvent(new Event("input")); }
    if(e.key==="Enter"){ const q=input.value.trim(); if(q) nav("#/search/"+encodeURIComponent(q)); }
  });

/* ─────────────────────────── SEARCH ─────────────────────────── */
function renderSearchScreen(app, q0){
  // q0 comes from parseHash(), already decoded via safeDecode — do NOT decode again (double-decode bug).
  q0 = q0 || "";
  setCrumb([["Command Center","#/"],["Search",null]]);
  const omni=el("div","omni");
  omni.innerHTML='<input id="omniInput" type="text" autocomplete="off" spellcheck="false" '+
    'placeholder="Search a script, a customer moment, an automation…" value="'+esc(q0)+'">'+
    '<button class="clr" id="omniClr" title="Clear" style="display:'+(q0?'inline-flex':'none')+'">✕</button>';
  app.appendChild(omni);
  const results=el("div",""); results.id="omniResults"; app.appendChild(results);
  const input=$("omniInput"), clr=$("omniClr");
  const run=()=>{ const q=input.value.trim(); clr.style.display=q?"inline-flex":"none";
    if(q) renderSearch(results,q); else results.innerHTML=""; };
  input.addEventListener("input", run);
  input.addEventListener("keydown", e=>{ if(e.key==="Escape"){ input.value=""; run(); }});
  clr.onclick=()=>{ input.value=""; run(); input.focus(); };
  if(q0) run();
  setTimeout(()=>input.focus(),40);
}
function rankItem(it, q){
  const code=(it.code||"").toLowerCase(), qn=q, qStrip=q.replace(/^[\^\/]/,"");
  if(code===qn || code.replace(/^[\^\/]/,"")===qStrip) return 0;
  if(it.name.startsWith(qn)) return 1;
  if(it.name.includes(qn)) return 2;
  if(it.subj && it.subj.includes(qn)) return 3;
  if(it.hay.includes(qn)) return 4;
  return 99;
}
function renderSearch(container, q){
  container.innerHTML="";
  const qn=q.toLowerCase();
  const scored = IDX.searchIdx.map(it=>({it, r:rankItem(it,qn)})).filter(x=>x.r<99)
    .sort((a,b)=>a.r-b.r);
  if(!scored.length){
    container.appendChild(el("div","empty",'<div class="big">No matches for "'+esc(q)+'"</div><div>Try a script code, a customer moment, or a workflow id.</div>'));
    return;
  }
  const groups=["Scripts","Calls","Automations","Journeys","Stages"];
  const byGroup={}; scored.forEach(x=>{ (byGroup[x.it.group]=byGroup[x.it.group]||[]).push(x.it); });
  groups.forEach(g=>{
    const items=byGroup[g]; if(!items||!items.length) return;
    const sg=el("div","sgroup");
    sg.appendChild(el("h3","", esc(g)+' <span class="n">'+items.length+'</span>'));
    const shown = items.slice(0,5);
    shown.forEach(it=>sg.appendChild(searchRow(it)));
    if(items.length>5){

/* ─────────────────────────── merge field rendering (safe, text-node) ─────────────────────────── */
const TOKEN_RE=/\[[^\]\n]+\]/g;
function fieldMap(code){
  const m={}; (IDX.fieldsByScript[code]||[]).forEach(f=>{ m[f.fieldName]={sample:f.sampleValue, fallback:f.fallback}; });
  return m;
}
function sampleFor(map, token){
  const f=map[token];
  if(f) return (f.sample&&String(f.sample).trim())?f.sample:(f.fallback||token.replace(/[\[\]]/g,""));
  return token.replace(/[\[\]]/g,"").toLowerCase();
}
function mergeFrag(text, code){
  const map=fieldMap(code);
  const frag=document.createDocumentFragment();
  let last=0, m; TOKEN_RE.lastIndex=0;
  const str=String(text==null?"":text);
  while((m=TOKEN_RE.exec(str))){
    if(m.index>last) frag.appendChild(document.createTextNode(str.slice(last,m.index)));
    const span=document.createElement("span");
    if(showRawFields){ span.className="mg raw"; span.textContent=m[0]; }
    else { span.className="mg"; span.textContent=sampleFor(map,m[0]); }
    frag.appendChild(span);
    last=m.index+m[0].length;
  }
  if(last<str.length) frag.appendChild(document.createTextNode(str.slice(last)));
  return frag;
}
function mergeHtml(html, code, raw){
  const map=fieldMap(code);
  return String(html).replace(TOKEN_RE, tok=>{
    if(raw) return '<mark style="background:#eef0f2;color:#475569;font-weight:700;border-radius:3px;padding:0 3px">'+esc(tok)+'</mark>';
    return '<mark style="background:rgba(247,190,0,.32);border-radius:3px;padding:0 2px">'+esc(sampleFor(map,tok))+'</mark>';
  });
}
function splitParas(text){
  const t=String(text||"").trim();
  if(!t) return [""];
  return t.split(/\n/).map(x=>x.trim()).filter(Boolean);
}
function splitLines(text){ return String(text||"").split(/\n/).map(x=>x.trim()).filter(Boolean); }

    col.appendChild(el("h4","", a.ic+' '+a.label+' <span class="n">'+tps.length+'</span>'));
    tps.forEach(t=>col.appendChild(autoCard(t)));
    board.appendChild(col);
  });
  app.appendChild(board);

  // behavior triggers
  if((DATA.behavior_triggers||[]).length){
    app.appendChild(sectionHead("Behavior signals","Locked strategy — engagement reactions, tiered. Never auto-reply."));
    const g=el("div","grid");
    DATA.behavior_triggers.forEach(b=>{
      const c=el("div","ecard");
      c.innerHTML='<div class="nm">On '+esc(b.trigger)+'</div>'+
        '<div class="subj"><b>T1:</b> '+esc(b.responseT1)+'<br><b>T2:</b> '+esc(b.responseT2)+'<br><b>T3:</b> '+esc(b.responseT3)+'</div>'+
        '<div class="row"><span class="sysbadge">'+esc(b.recencyRule||"")+'</span>'+(b.neverAutoReply?'<span class="chip off">⛔ never auto-reply</span>':'')+'</div>';
      g.appendChild(c);
    });
    app.appendChild(g);
  }
}
function autoCard(t){
  const c=el("div","acard"); c.id="ac-"+t.id;
  const scripts=(IDX.tsByTouchpoint[t.id]||[]).map(r=>IDX.byCode[r.scriptCode]||IDX.gapByCode[r.scriptCode]).filter(Boolean);
  let html='<div class="anm">'+esc(t.name)+' '+healthDot(t.healthStatus)+'</div>'+
    '<div class="meta2"><b>System:</b> <span class="sysbadge">'+esc(sysLabelOf(t.system))+'</span><br>'+
    '<b>Trigger:</b> '+esc(t.trigger||"—")+'<br><b>Schedule:</b> '+esc(t.schedule||"—")+'</div>';
  if(scripts.length){
    html+='<div class="foot">';
    scripts.forEach(s=>{ html+='<span class="sysbadge">'+(s.channel==="call"?"📞 ":"📧 ")+esc(s.name)+'</span>'; });
    html+='</div>';
  }
  if(t.workflowId) html+='<div class="foot"><span class="mono">'+esc(t.workflowId)+'</span></div>';
  if(t.notes) html+='<div class="meta2" style="color:#6b7280;font-size:11.5px">'+esc(t.notes)+'</div>';
  c.innerHTML=html;
  // Every card opens the focused detail panel — no dead ends.
  c.onclick=()=>nav("#/automations/"+t.id);
  return c;
}
function renderAutomationDetail(app, id){
  const t=IDX.tpById[id];
  if(!t){
    setCrumb([["Command Center","#/"],["Automations","#/automations"],["Not found",null]]);
    const e=el("div","empty",'<div class="big">No automation "'+esc(id)+'"</div><div>It may have been renamed.</div>');
    const sa=el("span","showall","See all automations →"); sa.onclick=()=>nav("#/automations");
    e.appendChild(sa); app.appendChild(e); return;
  }
  setCrumb([["Command Center","#/"],["Automations","#/automations"],[t.name,null]]);
  app.appendChild(sectionHead(t.name,"How it fires, its health, and everything it sends"));

  const wrap=el("div","detail");

  // ── left: the automation's facts, in an email-style frame (not monospace) ──
  const main=el("div","frame");
  const fh=el("div","fh");
  fh.innerHTML=
    '<div class="subj" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'+esc(t.name)+' '+autoChip(t.autoLevel)+healthDot(t.healthStatus)+'</div>'+
    '<div class="ln" style="margin-top:10px"><span class="k">System</span><span class="v"><span class="sysbadge">'+esc(sysLabelOf(t.system))+'</span></span></div>'+
    '<div class="ln"><span class="k">Health</span><span class="v">'+esc(healthLabel(t.healthStatus))+'</span></div>'+
    '<div class="ln"><span class="k">Trigger</span><span class="v">'+esc(t.trigger||"—")+'</span></div>'+
    '<div class="ln"><span class="k">Schedule</span><span class="v">'+esc(t.schedule||"—")+'</span></div>'+
    (t.workflowId?'<div class="ln"><span class="k">Workflow</span><span class="v"><span class="mono">'+esc(t.workflowId)+'</span></span></div>':'');
  main.appendChild(fh);
  if(t.notes){
    const nb=el("div","body"); nb.style.fontSize="15px";
    const p=el("p"); p.textContent=t.notes; nb.appendChild(p); main.appendChild(nb);
  }
  wrap.appendChild(main);

  // ── side: what it sends, the journeys it lives in, and a way back ──
  const side=el("div","meta-side");
  const joins=IDX.tsByTouchpoint[id]||[];
  const linked=joins.map(r=>({r, sc:IDX.byCode[r.scriptCode], gap:IDX.gapByCode[r.scriptCode]})).filter(o=>o.sc||o.gap);
  const cts=[...new Set(DATA.journeys.filter(j=>j.touchpointId===id).map(j=>j.customerType))];

  if(linked.length){
    const p=el("div","panel"); p.appendChild(el("h3","","Sends these"));
    const ll=el("div","linklist");
    linked.forEach(o=>{
      const a=el("div","lnk");
      if(o.sc){
        a.innerHTML=(o.sc.channel==="call"?"📞 ":"📧 ")+'<span>'+esc(o.sc.name)+'</span>'+(o.r.role?' <span class="sysbadge">'+esc(o.r.role)+'</span>':'')+'<span class="ar">→</span>';
        a.onclick=()=>nav((o.sc.channel==="call"?"#/calls/":"#/scripts/")+slugify(o.sc.code));
      } else {
        a.innerHTML='🕓 <span>'+esc(o.gap.name)+'</span> <span class="gaptag">'+esc(o.gap.publishStatus)+'</span><span class="ar">→</span>';
        a.onclick=()=>nav((o.gap.channel==="call"?"#/calls/":"#/scripts/")+slugify(o.gap.code));
      }
      ll.appendChild(a);
    });
    p.appendChild(ll); side.appendChild(p);
  } else {
    const p=el("div","panel"); p.appendChild(el("h3","","No script attached"));
    p.appendChild(el("div","fires",'No script — manual touch. This step runs without prewritten copy'+(cts.length?', inside the journey'+(cts.length>1?'s':'')+' below.':'.')));
    side.appendChild(p);
  }

  if(cts.length){
    const p=el("div","panel"); p.appendChild(el("h3","","Used in these journeys"));
    const ll=el("div","linklist");
    cts.forEach(ct=>{
      const a=el("div","lnk");
      a.innerHTML='🧭 <span>'+esc(journeyLabel(ct))+'</span><span class="ar">→</span>';
      a.onclick=()=>nav("#/journeys/"+ct);
      ll.appendChild(a);
    });
    p.appendChild(ll); side.appendChild(p);
  }

  const pa=el("div","panel");
  const acts=el("div","actions");
  const back=el("button","btn ghost","← All automations"); back.onclick=()=>nav("#/automations");
  acts.appendChild(back); pa.appendChild(acts);
  pa.appendChild(el("div","sheetnote","This panel is read-only — automations are configured in n8n, not the Sheet."));
  side.appendChild(pa);

  wrap.appendChild(side);
  app.appendChild(wrap);
}

/* ─────────────────────────── LIFECYCLE ─────────────────────────── */
function normStage(s){ return String(s||"").toUpperCase().replace(/[^A-Z]/g,""); }
function renderLifecycle(app, stageId){
  setCrumb([["Command Center","#/"],["Lifecycle",null]]);
  app.appendChild(sectionHead("Lifecycle","NEW to LOST — every stage, its rules, and what fires there"));
  const stages=DATA.stages.slice().sort((a,b)=>(+a.sortOrder||0)-(+b.sortOrder||0));
  const row=el("div","stages");
  stages.forEach((st,i)=>{
    const n=el("div","stnode"+(st.id===stageId?" on":""));
    n.innerHTML='<div class="sord">'+st.sortOrder+'</div><div class="sname">'+esc(st.name)+'</div>'+
      '<div class="sown">'+esc(st.automationOwner||"")+'</div>';
    n.onclick=()=>nav("#/lifecycle/"+st.id);
    row.appendChild(n);
  });
  app.appendChild(row);

  const active = stageId ? stages.find(s=>s.id===stageId) : null;
  if(active){
    const panel=el("div","stpanel");
    panel.appendChild(el("div","",'<div style="font-size:20px;font-weight:800;text-transform:uppercase">'+esc(active.name)+'</div>'));
    panel.appendChild(el("div","rule",'<span class="tag in">Enters</span><span>'+esc(active.entryRule)+'</span>'));
    panel.appendChild(el("div","rule",'<span class="tag out">Exits</span><span>'+esc(active.exitRule)+'</span>'));
    panel.appendChild(el("div","sheetnote","Owner: "+esc(active.automationOwner||"—")+" · North Star: "+esc(active.northStarAnchor||"—")));
    // touchpoints firing at this stage (via journeys.stage)
    const ns=normStage(active.name);
    const jrows=DATA.journeys.filter(j=>normStage(j.stage)===ns);
    const tpIds=[...new Set(jrows.map(j=>j.touchpointId))];
    panel.appendChild(el("h3","",'<span style="font-size:11.5px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);font-weight:800;display:block;margin:16px 0 10px">What fires here</span>'));
    if(!tpIds.length){ panel.appendChild(el("div","sheetnote","No outbound touch defined at this stage — customers pass through on the data engine only.")); }
    const ll=el("div","linklist");
    tpIds.forEach(id=>{
      const tp=IDX.tpById[id]; if(!tp) return;
      const a=el("div","lnk");
      a.innerHTML=autoChip(tp.autoLevel)+' <span>'+esc(tp.name)+'</span> '+healthDot(tp.healthStatus)+'<span class="ar">→</span>';
      const scripts=(IDX.tsByTouchpoint[id]||[]).map(r=>IDX.byCode[r.scriptCode]).filter(Boolean);
      if(scripts.length){ a.onclick=()=>nav((scripts[0].channel==="call"?"#/calls/":"#/scripts/")+slugify(scripts[0].code)); }
      else { a.onclick=()=>nav("#/automations/"+id); }
      ll.appendChild(a);
    });
    panel.appendChild(ll);
    app.appendChild(panel);
  } else {
    app.appendChild(el("div","sheetnote","Tap a stage above to see its entry / exit rules and every touch that fires there."));
  }
}

function renderValidation(app){
  setCrumb([["Command Center","#/"],["Validation",null]]);
  app.appendChild(sectionHead("Validation","Every gap, made visible — drafts and unwritten scripts that automation can't touch yet"));
  const errs=(DATA.meta&&+DATA.meta.validationErrors)||0;
  const banner=el("div","vbanner"+(errs>0?"":" ok"));
  banner.innerHTML = errs>0
    ? '⚠️ <b>'+errs+' validation error'+(errs>1?'s':'')+'</b> — a live row failed its checks and was demoted to a gap. Fix in the Sheet.'
    : '✅ No validation errors. Every live script passed its checks. '+((DATA.gaps||[]).length)+' rows are drafts/pending (below) — visible on purpose.';
  app.appendChild(banner);

  const gaps=(DATA.gaps||[]);
  gaps.forEach(g=>{
    const r=el("div","vrow");
    r.innerHTML='<div><div class="vnm">'+esc(g.name)+'</div><div class="vcd">'+esc(g.code)+' · '+esc(g.channel||"")+'</div></div>'+
      '<span class="chip planned">🕓 '+esc(g.publishStatus.toUpperCase())+'</span>'+
      '<div class="vwhy">'+esc(gapReason(g))+(g.notes?" — "+esc(g.notes):"")+'</div>';
    const link=el("a","vlink",(g.sheetRow!=null?"Row "+g.sheetRow+" →":"Open row →")); link.href=editUrl(g.sheetRow); link.target="_blank"; link.rel="noopener noreferrer";
    r.appendChild(link);
    r.onclick=(e)=>{ if(e.target.tagName!=="A") nav((g.channel==="call"?"#/calls/":"#/scripts/")+slugify(g.code)); };
    app.appendChild(r);
  });
  if(!gaps.length){ app.appendChild(el("div","empty",'<div class="big">No gaps</div><div>Every script is written and live.</div>')); }
}

function sectionHead(title, sub){ return el("h2","sec",esc(title)+(sub?' <span class="sub">'+sub+'</span>':'')); }
function clear(app){ app.innerHTML=""; return app; }
const SHEET_ID_FALLBACK="1DpCmsD1oQ7YkzpcmokQJKwB2npXga9gUn5YgkX44V4c", SCRIPTS_GID_FALLBACK=1928933180;
function scriptsGid(){ return (DATA.meta&&DATA.meta.gids&&DATA.meta.gids.SCRIPTS)||SCRIPTS_GID_FALLBACK; }
function sheetId(){ return (DATA.meta&&DATA.meta.sheetId)||SHEET_ID_FALLBACK; }
function sheetUrl(){ return "https://docs.google.com/spreadsheets/d/"+sheetId()+"/edit#gid="+scriptsGid(); }
function editUrl(row){ return "https://docs.google.com/spreadsheets/d/"+sheetId()+"/edit#gid="+scriptsGid()+(row!=null?"&range=A"+row:""); }
function gapReason(g){
  if(g.reason) return g.reason;
  if(Array.isArray(g.errors)&&g.errors.length) return g.errors.join("; ");
  return g.publishStatus==="ready" ? "awaiting Holly approval"
    : (String(g.bodyText||"").trim() ? "draft, not yet live" : "planned, not yet written");
}
function copyText(text, btn){
  const done=()=>{ const o=btn.textContent; btn.textContent="Copied ✓"; setTimeout(()=>btn.textContent=o,1400); };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done, ()=>fallbackCopy(text,done)); }
  else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");}catch(e){} ta.remove(); done();
}
