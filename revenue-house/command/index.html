// Read-only render of the shared retention-activity CONTRACT. The page WRITES NOTHING.
// Fail-soft LOUD: a null movement array, or a sourceStatus !== "ok", renders "source unavailable"
// — never an empty list that would read as "nothing happened".
const ACT_ENGINES = [
  {key:"qc",        label:"QC + Review",        one:"Sale-pipeline boxes with a review sent (field 1078)"},
  {key:"crosssell", label:"Cross-sell",         one:"Retention-pipeline boxes with cross-sell movement (1025)"},
  {key:"atrisk",    label:"At-Risk Save-Touch", one:"Save-touch stamps in window (1026–1029; 1030 = presence only)"}
];

// Format a PT ISO ("2026-07-15T09:00:00-07:00") to a short string IN Pacific time. The server
// already emits PT and carries meta.tz; we re-format in that zone so a machine in another TZ
// still reads PT. Falls back to a literal HH:MM lift if the value isn't a parseable instant.
function fmtPT(iso, withDate){
  if(iso==null || iso==="") return "";
  const d = new Date(iso);
  const lift = ()=>{ const m=String(iso).match(/T(\d{2}):(\d{2})/); return m ? m[1]+":"+m[2] : ""; };
  if(isNaN(d.getTime())) return lift();
  const tz = (ACTIVITY && ACTIVITY.meta && ACTIVITY.meta.tz) || "America/Los_Angeles";
  try{
    const opt = withDate
      ? {timeZone:tz, month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}
      : {timeZone:tz, hour:"numeric", minute:"2-digit"};
    return new Intl.DateTimeFormat("en-US", opt).format(d);
  }catch(e){ return lift(); }
}

// Load the activity payload. bust=true adds a cache-busting query param (the Refresh button).
// Copies the existing view's fetch discipline (fetchWithTimeout: AbortController + no-store).
// Falls back to the offline `activity` block for review with no live webhook — first from the
// already-loaded DATA (if the whole page fell back to sample), then by fetching ./sample-data.json
// directly (mirrors load()'s step-3 mirror), so the sample renders even when the main DATA is live.
function validActivity(a){ return a && Array.isArray(a.health) && a.engines; }
async function loadActivity(bust){
  // 1. live sibling webhook — long timeout (cold assemble is 15–40s). Refresh MUST send
  //    refresh=1: the workflow busts its cache on that param only, so a bare ?t= would return
  //    the same stale cache (the button would look alive but do nothing).
  try{
    const url = ACTIVITY_ENDPOINT + (bust ? ("?refresh=1&t="+Date.now()) : "");
    const d = await fetchWithTimeout(url, ACTIVITY_FETCH_TIMEOUT);
    if(validActivity(d)){ ACTIVITY_SOURCE="live"; return d; }
  }catch(e){ /* fall through to the offline sample */ }
  // 2. activity block already present on the loaded payload
  if(DATA && validActivity(DATA.activity)){ ACTIVITY_SOURCE="sample"; return DATA.activity; }
  // 3. static sample-data mirror beside the page
  try{
    const d = await fetchWithTimeout("./sample-data.json"+(bust?("?t="+Date.now()):""), FETCH_TIMEOUT);
    if(d && validActivity(d.activity)){ ACTIVITY_SOURCE="sample"; return d.activity; }
  }catch(e){}
  ACTIVITY_SOURCE="none"; return null;
}

// Load the per-agent flight-log payload — SAME fetch discipline + SAME 3-step fallback as
// loadActivity, but its OWN source flag so a flight-log outage never masquerades as the activity
// feed's state (they're independent webhooks; either can be down alone).
function validFlightlog(f){ return f && Array.isArray(f.agents); }
async function loadFlightlog(bust){
  try{
    const url = FLIGHTLOG_ENDPOINT + (bust ? ("?refresh=1&t="+Date.now()) : "");
    const d = await fetchWithTimeout(url, FLIGHTLOG_FETCH_TIMEOUT);
    if(validFlightlog(d)){ FLIGHTLOG_SOURCE="live"; return d; }
  }catch(e){ /* fall through to the offline sample */ }
  if(DATA && validFlightlog(DATA.flightlog)){ FLIGHTLOG_SOURCE="sample"; return DATA.flightlog; }
  try{
    const d = await fetchWithTimeout("./sample-data.json"+(bust?("?t="+Date.now()):""), FETCH_TIMEOUT);
    if(d && validFlightlog(d.flightlog)){ FLIGHTLOG_SOURCE="sample"; return d.flightlog; }
  }catch(e){}
  FLIGHTLOG_SOURCE="none"; return null;
}

// Overall dot — computed client-side from health[] per the contract rule, so the dot can NEVER
// disagree with the chips it summarizes (that consistency is the point of the forced-red
// acceptance test). STAGED entries are excluded entirely — otherwise the strip is amber/red by
// default pre-flip and Holly learns to ignore it. Equals payload.overall when the server agrees.
function activityOverall(health){
  let red=false, amber=false;
  (health||[]).forEach(h=>{
    if(h.state==="STAGED") return;                             // inactive by design → never drives the dot
    if(h.sourceStatus && h.sourceStatus!=="ok"){ amber=true; return; }  // can't trust it → amber, NEVER red
    if(h.state==="ACTIVE-PROBLEM") red=true;
  });
  return red ? "red" : (amber ? "amber" : "green");
}

function healthPill(h){
  const src = h.sourceStatus || "ok";
  const badSrc = (src==="unreadable" || src==="no-data");   // unreadable/no-data => grey, NEVER red
  let cls, stateLbl;
  // STAGED wins the label even when its source reads no-data (an inactive wf has no runs) — the
  // point is to say "off by design", not "broken data". Both render grey / excluded from the dot.
  if(h.state==="STAGED"){ cls="staged"; stateLbl="staged / inactive by design"; }
  else if(badSrc){ cls="nodata"; stateLbl="no data"; }
  else if(h.state==="ACTIVE-PROBLEM"){ cls="problem"; stateLbl="problem"; }
  else { cls="ok"; stateLbl="ok"; }
  // Who fixes a problem here. Known enum, but esc'd for consistency; missing => "manual".
  const rawOwner = (h.fixOwner==="auto"||h.fixOwner==="agent"||h.fixOwner==="manual") ? h.fixOwner : "manual";
  const FIX_LONG = {auto:"AUTO (self-heals)", agent:"AGENT", manual:"MANUAL (Holly/Jean)"};
  const pill=el("div","hpill "+cls);
  // Subtle owner badge on the title row (quiet on OK/STAGED; the red chip also gets the loud line).
  let html='<div class="hl"><span class="dotp"></span>'+esc(h.label||h.wf||"—")+
      '<span class="fixown '+rawOwner+'">'+esc(rawOwner.toUpperCase())+'</span></div>'+
    '<div class="ht"><span class="hstate">'+esc(stateLbl)+'</span>'+(h.schedule?'<span>'+esc(h.schedule)+'</span>':'')+'</div>';
  if(badSrc && h.state!=="STAGED"){
    html+='<div class="hd">last run: source unavailable</div>';
  } else {
    const when=fmtPT(h.lastRunPT, true);
    html+='<div class="ht">last run: '+(when?esc(when)+" PT":"—")+
      (h.lastStatus?' · '+esc(h.lastStatus):'')+'</div>';
    if(h.detail) html+='<div class="hd">'+esc(h.detail)+'</div>';
  }
  // On a red PROBLEM chip, promote the fix owner to a prominent line so Holly instantly knows
  // whether it's hers to act on (MANUAL), an agent's, or self-healing.
  if(cls==="problem"){
    html+='<div class="fixline '+rawOwner+'">→ FIX: '+esc(FIX_LONG[rawOwner])+'</div>';
  }
  pill.innerHTML=html;
  return pill;
}

// One movement card (qc / crosssell / atrisk): box name, owner mailbox ("from"), date,
// invoice (qc), step (atrisk), and an [Open in Streak] link from streakUrl.
function movementCard(row, engineKey){
  const c=el("div","ecard mv");
  let html='<div class="nm">'+esc(row.box||"—")+'</div>'+
    '<div class="cd">from '+esc(row.owner||"—")+(row.date?' · '+esc(row.date):'')+'</div>';
  const badges=[];
  if(engineKey==="qc" && row.invoice) badges.push('<span class="cad">#'+esc(row.invoice)+'</span>');
  if(engineKey==="atrisk" && row.step) badges.push('<span class="cad">'+esc(row.step)+'</span>');
  if(engineKey==="atrisk" && row.threads!=null) badges.push('<span class="sysbadge">'+esc(row.threads)+' thread'+(+row.threads===1?'':'s')+'</span>');
  const rw=el("div","row"); rw.innerHTML=badges.join("");
  // Only wire the link for an https:// URL — never let a javascript:/data: value from the feed
  // become a clickable href. A non-conforming value simply omits the link.
  if(row.streakUrl && /^https:\/\//.test(String(row.streakUrl))){
    const a=el("a","slink","Open in Streak →");
    a.href=row.streakUrl; a.target="_blank"; a.rel="noopener noreferrer";
    rw.appendChild(a);
  }
  c.innerHTML=html; c.appendChild(rw);
  return c;
}

// One movement section. LOUD "source unavailable" when the fetch failed — signalled EITHER by
// arr===null/undefined OR by engineStatus[engine]==="unreadable" (a Streak failure that arrives as
// []). Only a genuinely-empty [] with engineStatus "ok" gets the calm "no movement" state — otherwise
// a failed fetch is indistinguishable from a quiet day (the silent-wrong class).
function movementSection(app, eng, arr, ds){
  const engStatus=(ACTIVITY.engineStatus||{})[eng.key];
  const unreadable = (arr==null) || (engStatus==="unreadable");
  const h=el("h2","sec"); h.innerHTML=esc(eng.label)+' <span class="sub">'+esc(eng.one)+'</span>'; app.appendChild(h);
  if(ds){
    // drafts/skips — automation layer (LEDGER), NOT Streak. null/unreadable never shown as 0.
    const note=el("div","sheetnote"); note.style.margin="-4px 0 10px";
    if((ds.sourceStatus && ds.sourceStatus!=="ok") || ds.drafts==null || ds.skips==null){
      note.textContent="drafts / skips: source unavailable (LEDGER)";
    } else {
      note.textContent="drafts "+ds.drafts+" · skips "+ds.skips+" (LEDGER · the drill-down)";
    }
    app.appendChild(note);
  }
  if(unreadable){
    app.appendChild(el("div","vbanner",'⚠️ Source unavailable — could not read '+esc(eng.label)+' movement from Streak. This is NOT "nothing happened."'));
    return;
  }
  if(!arr.length){
    app.appendChild(el("div","actempty","No "+esc(eng.label)+" movement in the window (today + last 7 days)."));
    return;
  }
  const g=el("div","grid"); arr.forEach(r=>g.appendChild(movementCard(r, eng.key))); app.appendChild(g);
}

// ── FLIGHT LOG renderers ──────────────────────────────────────────────────
// EVERY field below is emitter-supplied / customer data → esc() on the way in. comms may be null.
// Normalize the fix-owner enum (unknown => manual) exactly like healthPill does.
function fixOwnerOf(v){ return (v==="auto"||v==="agent"||v==="manual") ? v : "manual"; }

// Comms → the existing email-frame chrome. body_html renders in a sandboxed iframe (sandbox=""
// disables scripts) — the SAME safe path the Scripts view uses; headers are esc'd/textContent.
function commsFrame(comms){
  const frame=el("div","frame");
  const fh=el("div","fh");
  fh.innerHTML='<div class="ln"><span class="k">From</span><span class="v">'+esc(comms.from||"—")+'</span></div>'+
    '<div class="ln"><span class="k">To</span><span class="v">'+esc(comms.to||"—")+'</span></div>';
  const subjEl=el("div","subj"); subjEl.textContent=comms.subject||"(no subject)"; fh.appendChild(subjEl);
  frame.appendChild(fh);
  const hasBody = typeof comms.body_html==="string" && comms.body_html.trim();
  if(hasBody){
    const iframe=document.createElement("iframe");
    iframe.setAttribute("sandbox","");
    iframe.setAttribute("title","Message preview");
    iframe.srcdoc = comms.body_html;          // sandboxed; scripts + same-origin disabled
    frame.appendChild(iframe);
  } else if(comms.body_truncated){
    const b=el("div","body"); b.textContent="Body stored at ref: "+(comms.ref||"(no ref)"); frame.appendChild(b);
  }
  return frame;
}

// One pinned OPEN-incident card (red, stays until resolved). Coalesced summary + subjects + fix
// owner + alert marker on the face; lastAction/detail/comms behind the expand.
function incidentCard(inc){
  const subjects = Array.isArray(inc.subjects) ? inc.subjects : [];
  const m = subjects.length;
  const n = (inc.failCount!=null) ? inc.failCount : 0;
  const owner = fixOwnerOf(inc.fixOwner);
  const since = fmtPT(inc.firstSeen, true) || inc.firstSeen || "—";
  const d = el("details","pincard"+(inc.severity==="critical"?" crit":""));
  const sum = el("summary");
  sum.innerHTML='<span class="pdot"></span>'+
    '<span class="psig">'+esc(inc.signature||"—")+'</span>'+
    '<span class="pcount">'+esc(n)+' failure'+(n===1?'':'s')+' · '+esc(m)+' subject'+(m===1?'':'s')+' affected · since '+esc(since)+'</span>'+
    '<span class="fixown '+owner+'">'+esc(owner.toUpperCase())+'</span>'+
    '<span class="alertmark '+(inc.alerted?'yes':'no')+'">'+(inc.alerted?'alerted':'not yet alerted')+'</span>';
  d.appendChild(sum);
  const body = el("div","pinbody");
  if(subjects.length){
    const sl=el("div","subjlist");
    sl.innerHTML='<span class="lbl">Subjects</span>'+subjects.map(s=>'<span class="subjchip">'+esc(s)+'</span>').join("");
    body.appendChild(sl);
  }
  if(inc.lastAction) body.appendChild(el("div","pinln",'<span class="lbl">Last action</span>'+esc(inc.lastAction)));
  if(inc.detail)     body.appendChild(el("div","pinln",'<span class="lbl">Detail</span>'+esc(inc.detail)));
  if(inc.comms)      body.appendChild(commsFrame(inc.comms));   // guard: null comms → nothing
  d.appendChild(body);
  return d;
}

// One recent flight-log row: time · action · PASS/FAIL/recovered pill · subject. A fail that
// self-corrected reads "recovered (auto/agent)"; a plain pass is quiet green. Expandable iff comms.
function recentRow(r){
  const time = esc(fmtPT(r.ts, false) || "—");
  let pillCls, pillTxt;
  if(r.result==="fail"){
    if(r.selfCorrected==="auto"||r.selfCorrected==="agent"){ pillCls="recovered"; pillTxt="recovered ("+esc(r.selfCorrected)+")"; }
    else { pillCls="fail"; pillTxt="FAIL"; }
  } else if(r.result==="pass"){ pillCls="pass"; pillTxt="pass"; }
  else { pillCls="other"; pillTxt=esc(r.result==null?"—":String(r.result).toUpperCase()); }
  const face='<span class="fltime">'+time+'</span>'+
    '<span class="flact">'+esc(r.action||"—")+'</span>'+
    '<span class="flpill '+pillCls+'">'+pillTxt+'</span>'+
    (r.subject?'<span class="flsubj">'+esc(r.subject)+'</span>':'');
  if(r.comms){
    const d=el("details","flrow hascomms");
    const sum=el("summary"); sum.innerHTML=face; d.appendChild(sum);
    const b=el("div","flbody");
    if(r.detail) b.appendChild(el("div","pinln",esc(r.detail)));
    b.appendChild(commsFrame(r.comms));
    d.appendChild(b);
    return d;
  }
  const row=el("div","flrow"); row.innerHTML=face; return row;
}

function agentPanel(ag){
  const incidents = Array.isArray(ag.incidents) ? ag.incidents : [];
  const panel = el("div","flpanel"+(incidents.length?" hasopen":""));
  const head = el("div","flhead");
  const openN = incidents.length;
  head.innerHTML='<div class="flname">'+esc(ag.displayName||ag.system||"—")+'</div>'+
    '<div class="flmeta">'+(openN
      ? '<span class="flopen">'+esc(openN)+' open incident'+(openN===1?'':'s')+'</span>'
      : '<span class="flclear">no open incidents</span>')+'</div>';
  panel.appendChild(head);
  // PINNED open incidents at the top.
  incidents.forEach(inc=>panel.appendChild(incidentCard(inc)));
  // Recent feed — rendered in the ORDER THE SERVER SENDS (canonical append/row order, already
  // reversed to newest-first by the workflow). Per the contract, append order is canonical and `ts`
  // is explicitly NOT the ordering key (cross-terminal clock skew) — so we do NOT re-sort by ts.
  const recent = Array.isArray(ag.recent) ? ag.recent : [];
  panel.appendChild(el("div","flsubhead","Recent flight log"));
  if(!recent.length){
    panel.appendChild(el("div","actempty","No recent events logged for this agent in the window."));
  } else {
    const feed=el("div","feed"); recent.forEach(r=>feed.appendChild(recentRow(r))); panel.appendChild(feed);
  }
  return panel;
}

// Muted ⚠ Ingest-errors strip — malformed rows the reader rejected (a BROKEN EMITTER is exactly
// what the board exists to surface). Small, at the very bottom.
function renderIngestErrors(app, errs){
  const list = Array.isArray(errs) ? errs : [];
  app.appendChild(el("div","ingesthead","⚠ Ingest errors"+(list.length?(" · "+list.length):"")+" (malformed emitter rows)"));
  if(!list.length){ app.appendChild(el("div","ingestempty","No malformed rows — every emitter wrote clean events.")); return; }
  const box=el("div","ingestbox");
  list.forEach(e=>{
    const row=el("div","ingestrow");
    row.innerHTML='<span class="igtime">'+esc(fmtPT(e.ts, true)||"—")+'</span>'+
      '<span class="igsys">'+esc(e.system||"—")+'</span>'+
      '<span class="igreason">'+esc(e.reason||"malformed row")+'</span>'+
      (e.eventId?'<span class="igid">'+esc(e.eventId)+'</span>':'')+
      (e.raw?'<div class="igraw">'+esc(e.raw)+'</div>':'');
    box.appendChild(row);
  });
  app.appendChild(box);
}

// The FLIGHT LOG section — one panel per agent (open-incident agents first), then the ingest strip.
// Fail-soft LOUD: an unreadable source says so; it NEVER renders empty-as-if-healthy.
function renderFlightlog(app){
  const h=el("h2","sec");
  h.innerHTML='Flight Log <span class="sub">per agent — what each bot did, with open failures pinned</span>';
  app.appendChild(h);
  if(FLIGHTLOG_SOURCE==="none" || !FLIGHTLOG){
    app.appendChild(el("div","vbanner",'⚠️ Flight-log source unavailable — could not read the Watchtower flight log. This is NOT "every agent is healthy."'));
    return;
  }
  if(FLIGHTLOG_SOURCE==="sample"){
    const sb=el("div","","⚠ SAMPLE FLIGHT LOG — not live. Agent incidents and rows below are canned fixtures.");
    sb.style.cssText="background:#fffbeb;border:1.5px solid #f0c14b;color:#7c4a03;border-radius:12px;"+
      "padding:11px 16px;font-size:12.5px;font-weight:800;margin:2px 0 8px";
    app.appendChild(sb);
  }
  const agents=(Array.isArray(FLIGHTLOG.agents)?FLIGHTLOG.agents:[]).slice();
  if(!agents.length){
    app.appendChild(el("div","actempty","No agents are reporting to the Watchtower yet."));
  } else {
    // Agents with any OPEN incident float to the top; ties broken by openCount desc, stable otherwise.
    agents.sort((a,b)=>{
      const ao=(Array.isArray(a.incidents)&&a.incidents.length)?0:1;
      const bo=(Array.isArray(b.incidents)&&b.incidents.length)?0:1;
      if(ao!==bo) return ao-bo;
      return (b.openCount||0)-(a.openCount||0);
    });
    agents.forEach(ag=>app.appendChild(agentPanel(ag)));
  }
  renderIngestErrors(app, FLIGHTLOG.ingestErrors);
}

function renderActivity(app){
  setCrumb([["Command Center","#/"],["The Watchtower",null]]);
  // Spinner first — a slow webhook must never look like a blank page.
  app.appendChild(el("div","empty",'<div class="big">Loading activity…</div><div>Reading retention movement + engine health + the agent flight log.</div>'));
  // Fetch both feeds in parallel; each has its own timeout + fallback + source flag.
  Promise.all([loadActivity(false), loadFlightlog(false)])
    .then(([a,f])=>{ ACTIVITY=a; FLIGHTLOG=f; paintActivity(app); });
}

function paintActivity(app){
  app.innerHTML="";
  if(!ACTIVITY){
    const e=el("div","empty",'<div class="big">Activity unavailable</div>'+
      '<div>The retention-activity feed is unreachable and no offline sample was found.<br>'+
      'Open this page from the deployed site (past the PIN gate), or place <span class="mono">sample-data.json</span> beside it.</div>');
    const btn=el("button","btn ghost","Retry"); btn.style.marginTop="14px";
    btn.onclick=()=>renderActivity(clear(app));
    e.appendChild(btn); app.appendChild(e); return;
  }
  const A=ACTIVITY, meta=A.meta||{}, engines=A.engines||{};

  // ── SAMPLE guard (M3): if the live webhook was down and we fell back to the offline block, the
  // health + customer rows are CANNED — mark the whole view loudly so a green topbar (main feed up,
  // activity webhook down) can never sit over fabricated data. Not left to the small lookback line.
  if(ACTIVITY_SOURCE==="sample"){
    const sb=el("div","","⚠ SAMPLE DATA — not live. Health and customer rows below are canned fixtures, not the live retention feed.");
    sb.style.cssText="background:#fffbeb;border:1.5px solid #f0c14b;color:#7c4a03;border-radius:12px;"+
      "padding:13px 18px;font-size:13.5px;font-weight:800;margin:6px 0 4px;display:flex;gap:10px;align-items:center";
    app.appendChild(sb);
  }

  // ── header: title + "data as of HH:MM PT" + fixed lookback + Refresh ──
  const hd=el("div","acthead");
  const asOf=fmtPT(meta.asOf, false);
  const left=el("div");
  left.innerHTML='<div class="crumb" style="color:#b45309">Retention · The Watchtower</div>'+
    '<div style="font-size:22px;font-weight:800;text-transform:uppercase;margin-top:3px">The Watchtower</div>'+
    '<div style="font-size:13px;color:#6b7280;margin-top:2px">What the system did — one view over every engine</div>'+
    '<div class="sheetnote" style="margin-top:4px">Lookback: <b>today + last 7 days</b>'+
      (ACTIVITY_SOURCE==="sample"?' · <b style="color:#b45309">offline sample</b>':'')+'</div>';
  const right=el("div","actright");
  const asofBadge=el("div","actasof"); asofBadge.innerHTML='data as of <b>'+(asOf?esc(asOf)+" PT":"—")+'</b>';
  const refresh=el("button","btn ghost","↻ Refresh"); refresh.setAttribute("aria-label","Refresh activity data");
  refresh.onclick=()=>{ refresh.disabled=true; refresh.textContent="Refreshing…";
    Promise.all([loadActivity(true), loadFlightlog(true)]).then(([a,f])=>{ ACTIVITY=a; FLIGHTLOG=f; paintActivity(app); }); };
  right.appendChild(asofBadge); right.appendChild(refresh);
  hd.appendChild(left); hd.appendChild(right);
  app.appendChild(hd);

  // ── PANEL 1 — health strip (always "now", not date-scoped) ──
  const overall=activityOverall(A.health);
  const overallLbl={green:"all clear",amber:"needs a look",red:"problem"}[overall];
  const h1=el("h2","sec");
  h1.innerHTML='Health <span class="sub">is anything broken — the strip is always "now"</span>'+
    '<span class="fresh '+overall+'" style="float:right;margin-top:-2px"><span class="fdot"></span>'+overallLbl+'</span>';
  app.appendChild(h1);
  if(!(A.health||[]).length){
    app.appendChild(el("div","actempty","No health entries in the payload."));
  } else {
    const strip=el("div","hstrip");
    (A.health||[]).forEach(h=>strip.appendChild(healthPill(h)));
    app.appendChild(strip);
    app.appendChild(el("div","sheetnote","Grey = staged (inactive by design) or no data — both excluded from the dot. The dot goes red only when a LIVE engine has a problem."));
    app.appendChild(el("div","sheetnote","Fix owner — AUTO: self-heals · AGENT: a Claude agent handles it · MANUAL: Holly or Jean."));
  }

  // ── PANEL 2 — movement, grouped by engine ──
  const ds=A.draftsSkips||{};
  ACT_ENGINES.forEach(eng=>{
    // Contract fail-soft signal: a MISSING key or explicit null = unreadable; [] = truly empty.
    const arr = (eng.key in engines) ? engines[eng.key] : null;
    movementSection(app, eng, arr, ds[eng.key]);
  });

  // Open-Deal Guard — rendered as CURRENT STATE, not a movement list (a stale hold must not
  // read as "activity"). Its own sourceStatus gates the fail-soft banner.
  const od=engines.opendeal;
  const h4=el("h2","sec"); h4.innerHTML='Open-Deal Guard <span class="sub">current state — suppressed boxes, not movement</span>'; app.appendChild(h4);
  if(!od || (od.sourceStatus && od.sourceStatus!=="ok")){
    app.appendChild(el("div","vbanner","⚠️ Source unavailable — could not read the Open-Deal suppression state."));
  } else {
    const card=el("div","panel");
    card.innerHTML='<h3>Currently suppressed</h3>'+
      '<div class="fires" style="font-size:24px;font-weight:800;color:#1f2430">'+esc(od.suppressedCount!=null?od.suppressedCount:"—")+
        ' <span style="font-size:13px;font-weight:600;color:var(--mut)">open-deal box'+(+od.suppressedCount===1?'':'es')+' held from touches</span></div>'+
      (od.oldestSuppression?'<div class="sheetnote" style="margin-top:8px">Oldest suppression: <b>'+esc(od.oldestSuppression)+'</b> — a stale hold must not read as activity.</div>':'');
    app.appendChild(card);
  }

  // ── PANEL 3 — the per-agent FLIGHT LOG (pinned open failures + recent feed + ingest strip) ──
  renderFlightlog(app);
}

function sectionHead(title, sub){ return el("h2","sec",esc(title)+(sub?' <span class="sub">'+sub+'</span>':'')); }

function gapReason(g){
  if(g.reason) return g.reason;
  if(Array.isArray(g.errors)&&g.errors.length) return g.errors.join("; ");
  return g.publishStatus==="ready" ? "awaiting Holly approval"
    : (String(g.bodyText||"").trim() ? "draft, not yet live" : "planned, not yet written");
}
function copyText(text, btn){
  const done=()=>{ const o=btn.textContent; btn.textContent="Copied ✓"; setTimeout(()=>btn.textContent=o,1400); };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done, ()=>fallbackCopy(text,done)); }
  else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");}catch(e){} ta.remove(); done();
}
