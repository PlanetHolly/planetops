<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Media Center</title>
  <link rel="stylesheet" href="../graphics/app.css">
  <style>
    .drop-grid { grid-template-columns: minmax(360px, .8fr) minmax(430px, 1.2fr); align-items: start; }
    .drop-zone {
      display: grid;
      place-items: center;
      min-height: 260px;
      border: 2px dashed var(--line);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      text-align: center;
      padding: 22px;
    }
    .drop-zone.drag { border-color: var(--yellow); background: #fff8df; }
    .drop-zone strong { display: block; font-size: 18px; margin-bottom: 8px; }
    .drop-zone span { color: var(--muted); font-weight: 700; }
    .media-preview {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: contain;
      background: #ece9e2;
      border: 1px solid var(--line);
      border-radius: 8px;
      display: none;
    }
    .filename-preview {
      min-height: 44px;
      overflow-wrap: anywhere;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #111;
      color: #fff;
      padding: 12px;
      font-weight: 900;
    }
    .result { display: none; margin-top: 12px; }
    .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
    .recent-list { display: grid; gap: 8px; }
    .recent-item { display: grid; gap: 3px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    .recent-item strong { overflow-wrap: anywhere; }
    .recent-item small { color: var(--muted); }
    @media (max-width: 980px) { .drop-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./"><svg class="pa-icon" xmlns="http://www.w3.org/2000/svg" viewBox="-270 -185 3237 2226" role="img" aria-label="Planet Apparel" preserveAspectRatio="xMidYMid meet"><g transform="translate(0,1856) scale(0.1,-0.1)" fill="currentColor"><path d="M26172 18550 c-77 -11 -149 -33 -222 -71 -30 -15 -1319 -875 -2865 -1911 l-2810 -1884 -79 96 c-317 380 -621 695 -976 1011 -1352 1203 -2909 1899 -4679 2094 -587 64 -1288 72 -1861 20 -1460 -133 -2796 -615 -4049 -1462 -1429 -966 -2537 -2349 -3190 -3981 -566 -1416 -736 -3047 -481 -4602 151 -917 461 -1808 919 -2645 39 -71 70 -133 69 -137 -2 -3 -1279 -862 -2838 -1908 -2558 -1715 -2842 -1908 -2910 -1978 -270 -277 -263 -712 15 -988 84 -82 195 -145 311 -174 154 -40 355 -21 486 46 29 15 736 485 1571 1045 835 561 1520 1019 1522 1019 2 0 594 396 1315 880 721 484 1315 880 1319 880 4 0 48 -51 98 -113 607 -750 1346 -1387 2203 -1897 1047 -623 2169 -1022 3302 -1174 958 -129 2004 -93 2953 100 1473 301 2847 993 4000 2013 173 153 542 522 697 698 825 934 1454 2053 1803 3208 185 613 285 1156 347 1890 21 239 17 1108 -5 1365 -47 534 -129 1032 -249 1505 -22 88 -43 166 -47 173 -5 8 -201 -118 -632 -407 l-626 -420 28 -148 c102 -540 134 -934 126 -1546 -7 -498 -28 -754 -98 -1177 -200 -1216 -704 -2316 -1494 -3265 -391 -470 -873 -928 -1345 -1277 -918 -680 -1949 -1106 -3100 -1282 -593 -91 -1328 -112 -1950 -55 -1565 142 -2908 728 -4099 1788 -258 229 -777 780 -754 801 9 8 12267 8233 16338 10962 2200 1475 2468 1657 2535 1726 42 42 90 102 107 132 103 181 121 420 46 610 -60 149 -186 292 -320 363 -126 66 -293 96 -431 77z m-12062 -2035 c760 -63 1436 -220 2100 -487 945 -380 1771 -934 2476 -1660 138 -142 414 -455 414 -468 -1 -3 -397 -270 -882 -595 -484 -324 -3185 -2136 -6002 -4026 l-5121 -3436 -49 91 c-246 458 -483 1111 -604 1666 -126 572 -175 1046 -175 1675 0 412 14 652 59 1010 200 1588 886 2967 2059 4140 961 961 2052 1591 3290 1899 464 115 910 178 1495 210 146 8 767 -4 940 -19z"/></g></svg><span>Media Center</span></a>
    <nav class="nav">
      <a href="./" aria-current="page">Drop</a>
      <a href="../graphics/">Graphics</a>
      <a href="../frontdoor/">Home</a>
    </nav>
  </header>

  <main class="wrap">
    <div class="header-row">
      <div>
        <h1>Photo Drop</h1>
        <p class="sub">Tag a completed project photo, preview its filename, and queue it for the Media Center index.</p>
      </div>
    </div>

    <section class="grid drop-grid">
      <div class="panel">
        <div id="dropZone" class="drop-zone" tabindex="0">
          <div>
            <strong>Drop photo</strong>
            <span>JPEG, PNG, or WebP up to 25MB</span>
          </div>
        </div>
        <input id="photo" type="file" accept="image/jpeg,image/png,image/webp" hidden>
        <div style="margin-top:12px"><img id="imagePreview" class="media-preview" alt=""></div>
      </div>

      <form id="mediaForm" class="panel">
        <div class="section-title">Tags</div>
        <div class="form-grid">
          <label>Brand
            <input id="brand" name="brand" autocomplete="organization">
          </label>
          <label>SKU
            <select id="sku" name="sku"><option value="">No SKU</option></select>
          </label>
          <label>Group
            <select id="group" name="group" required></select>
          </label>
          <label>Category
            <select id="cat" name="cat" required></select>
          </label>
          <label>Color
            <select id="color" name="color" required></select>
          </label>
          <label>Fabric
            <input id="fabric" name="fabric">
          </label>
          <label>Print Method
            <input id="print_method" name="print_method">
          </label>
          <label>Source ID
            <input id="sourceId" name="sourceId">
          </label>
          <label class="full">Description
            <textarea id="description" name="description"></textarea>
          </label>
        </div>

        <div style="margin-top:14px">
          <div class="section-title">Filename Preview</div>
          <div id="filenamePreview" class="filename-preview">Select tags to preview.</div>
        </div>

        <div class="actions">
          <button id="submitBtn" type="submit" disabled>Submit photo</button>
          <span id="status" class="sub"></span>
        </div>
        <div id="result" class="result card"></div>
      </form>
    </section>

    <section class="panel" style="margin-top:16px">
      <div class="section-title">Recent Assets</div>
      <div id="recent" class="recent-list"><div class="sub">Loading...</div></div>
    </section>
  </main>

  <script>
    const $ = sel => document.querySelector(sel);
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    let options = { skus: {} };
    let selectedDataUrl = "";
    let previewTimer = null;

    async function api(url, opts = {}) {
      const r = await fetch(url, { headers: { "Content-Type": "application/json", ...(opts.headers || {}) }, ...opts });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
      return data;
    }

    function fillSelect(el, values, first) {
      el.innerHTML = `${first ? `<option value="">${esc(first)}</option>` : ""}${values.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join("")}`;
    }

    function formPayload() {
      return {
        brand: $("#brand").value,
        sku: $("#sku").value,
        group: $("#group").value,
        cat: $("#cat").value,
        color: $("#color").value,
        fabric: $("#fabric").value,
        print_method: $("#print_method").value,
        description: $("#description").value,
        sourceId: $("#sourceId").value,
        ext: selectedDataUrl.match(/^data:image\/(jpeg|jpg|png|webp)/)?.[1]?.replace("jpeg", "jpg") || "jpg"
      };
    }

    function applySkuDefaults() {
      const sku = $("#sku").value;
      const row = options.skus[sku];
      if (!row) return;
      if (!$("#fabric").value) $("#fabric").value = row.material || "";
      if (!$("#print_method").value) $("#print_method").value = row.default_print_method || "";
      updatePreview();
    }

    async function updatePreview() {
      clearTimeout(previewTimer);
      previewTimer = setTimeout(async () => {
        const p = formPayload();
        if (!p.group || !p.cat || !p.color) {
          $("#filenamePreview").textContent = "Select tags to preview.";
          $("#submitBtn").disabled = true;
          return;
        }
        try {
          const data = await api("/api/media/preview", { method: "POST", body: JSON.stringify(p) });
          $("#filenamePreview").textContent = data.filename;
          $("#submitBtn").disabled = !selectedDataUrl;
        } catch (e) {
          $("#filenamePreview").textContent = e.message;
          $("#submitBtn").disabled = true;
        }
      }, 180);
    }

    function useFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        selectedDataUrl = String(reader.result || "");
        $("#imagePreview").src = selectedDataUrl;
        $("#imagePreview").style.display = "block";
        if (!$("#sourceId").value) $("#sourceId").value = file.name.replace(/\.[^.]+$/, "");
        updatePreview();
      };
      reader.readAsDataURL(file);
    }

    async function loadRecent() {
      try {
        const data = await api("/api/media/recent?limit=10");
        $("#recent").innerHTML = data.assets.length ? data.assets.map(a => `
          <div class="recent-item">
            <strong>${esc(a.filename)}</strong>
            <small>${esc(a.group)} / ${esc(a.cat)} / ${esc(a.color)} - ${esc(a.status)}${a.sink_status ? ` - sink ${esc(a.sink_status)}` : ""}</small>
          </div>
        `).join("") : `<div class="sub">No assets yet.</div>`;
      } catch (e) {
        $("#recent").innerHTML = `<div class="error">${esc(e.message)}</div>`;
      }
    }

    async function init() {
      options = await api("/api/media/options");
      fillSelect($("#group"), options.groups);
      fillSelect($("#cat"), options.cats);
      fillSelect($("#color"), options.colors, "Choose color");
      $("#sku").innerHTML = `<option value="">No SKU</option>` + Object.keys(options.skus).sort().map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join("");
      $("#group").value = "Bandanas";
      $("#cat").value = "Bandanas";
      $("#color").value = "Natural";
      updatePreview();
      loadRecent();
    }

    $("#dropZone").addEventListener("click", () => $("#photo").click());
    $("#dropZone").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") $("#photo").click(); });
    $("#photo").addEventListener("change", e => useFile(e.target.files[0]));
    $("#dropZone").addEventListener("dragover", e => { e.preventDefault(); $("#dropZone").classList.add("drag"); });
    $("#dropZone").addEventListener("dragleave", () => $("#dropZone").classList.remove("drag"));
    $("#dropZone").addEventListener("drop", e => {
      e.preventDefault();
      $("#dropZone").classList.remove("drag");
      useFile(e.dataTransfer.files[0]);
    });
    document.querySelectorAll("input, select, textarea").forEach(el => el.addEventListener("input", updatePreview));
    $("#sku").addEventListener("change", applySkuDefaults);
    $("#mediaForm").addEventListener("submit", async e => {
      e.preventDefault();
      $("#status").textContent = "Submitting...";
      $("#submitBtn").disabled = true;
      $("#result").style.display = "none";
      try {
        const data = await api("/api/media/intake", { method: "POST", body: JSON.stringify({ ...formPayload(), photo: selectedDataUrl }) });
        $("#result").innerHTML = `<strong>${esc(data.asset.filename)}</strong><br><span class="sub">${data.duplicate ? "Already existed; returned existing record." : "Queued locally for the Media Center sink."} Sink: ${esc(data.sink)}.</span>`;
        $("#result").style.display = "block";
        $("#status").textContent = "Saved";
        await loadRecent();
      } catch (err) {
        $("#status").textContent = err.message;
      } finally {
        $("#submitBtn").disabled = !selectedDataUrl;
      }
    });

    init().catch(e => {
      $("#filenamePreview").textContent = e.message;
      $("#recent").innerHTML = `<div class="error">${esc(e.message)}</div>`;
    });
  </script>
</body>
</html>
