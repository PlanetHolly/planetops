<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Media Center</title>
  <link rel="stylesheet" href="../graphics/app.css">
  <style>
    .drop-grid { grid-template-columns: minmax(360px, .8fr) minmax(430px, 1.2fr); align-items: start; }
    .drop-zone {
      display: grid;
      place-items: center;
      min-height: 260px;
      border: 2px dashed var(--line);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      text-align: center;
      padding: 22px;
    }
    .drop-zone.drag { border-color: var(--yellow); background: #fff8df; }
    .drop-zone strong { display: block; font-size: 18px; margin-bottom: 8px; }
    .drop-zone span { color: var(--muted); font-weight: 700; }
    .media-preview {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: contain;
      background: #ece9e2;
      border: 1px solid var(--line);
      border-radius: 8px;
      display: none;
    }
    .filename-preview {
      min-height: 44px;
      overflow-wrap: anywhere;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #111;
      color: #fff;
      padding: 12px;
      font-weight: 900;
    }
    .result { display: none; margin-top: 12px; }
    .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
    .recent-list { display: grid; gap: 8px; }
    .recent-item { display: grid; gap: 3px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    .recent-item strong { overflow-wrap: anywhere; }
    .recent-item small { color: var(--muted); }
    @media (max-width: 980px) { .drop-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./"><svg class="pa-icon" xmlns="http://www.w3.org/2000/svg" viewBox="-270 -185 3237 2226" role="img" aria-label="Planet Apparel" preserveAspectRatio="xMidYMid meet"><g transform="translate(0,1856) scale(0.1,-0.1)" fill="currentColor"><path d="M26172 18550 c-77 -11 -149 -33 -222 -71 -30 -15 -1319 -875 -2865 -1911 l-2810 -1884 -79 96 c-317 380 -621 695 -976 1011 -1352 1203 -2909 1899 -4679 2094 -587 64 -1288 72 -1861 20 -1460 -133 -2796 -615 -4049 -1462 -1429 -966 -2537 -2349 -3190 -3981 -566 -1416 -736 -3047 -481 -4602 151 -917 461 -1808 919 -2645 39 -71 70 -133 69 -137 -2 -3 -1279 -862 -2838 -1908 -2558 -1715 -2842 -1908 -2910 -1978 -270 -277 -263 -712 15 -988 84 -82 195 -145 311 -174 154 -40 355 -21 486 46 29 15 736 485 1571 1045 835 561 1520 1019 1522 1019 2 0 594 396 1315 880 721 484 1315 880 1319 880 4 0 48 -51 98 -113 607 -750 1346 -1387 2203 -1897 1047 -623 2169 -1022 3302 -1174 958 -129 2004 -93 2953 100 1473 301 2847 993 4000 2013 173 153 542 522 697 698 825 934 1454 2053 1803 3208 185 613 285 1156 347 1890 21 239 17 1108 -5 1365 -47 534 -129 1032 -249 1505 -22 88 -43 166 -47 173 -5 8 -201 -118 -632 -407 l-626 -420 28 -148 c102 -540 134 -934 126 -1546 -7 -498 -28 -754 -98 -1177 -200 -1216 -704 -2316 -1494 -3265 -391 -470 -873 -928 -1345 -1277 -918 -680 -1949 -1106 -3100 -1282 -593 -91 -1328 -112 -1950 -55 -1565 142 -2908 728 -4099 1788 -258 229 -777 780 -754 801 9 8 12267 8233 16338 10962 2200 1475 2468 1657 2535 1726 42 42 90 102 107 132 103 181 121 420 46 610 -60 149 -186 292 -320 363 -126 66 -293 96 -431 77z m-12062 -2035 c760 -63 1436 -220 2100 -487 945 -380 1771 -934 2476 -1660 138 -142 414 -455 414 -468 -1 -3 -397 -270 -882 -595 -484 -324 -3185 -2136 -6002 -4026 l-5121 -3436 -49 91 c-246 458 -483 1111 -604 1666 -126 572 -175 1046 -175 1675 0 412 14 652 59 1010 200 1588 886 2967 2059 4140 961 961 2052 1591 3290 1899 464 115 910 178 1495 210 146 8 767 -4 940 -19z"/></g></svg><span>Media Center</span></a>
    <nav class="nav">
      <a href="./" aria-current="page">Drop</a>
      <a href="../graphics/">Graphics</a>
      <a href="../frontdoor/">Home</a>
    </nav>
  </header>

  <main class="wrap">
    <div class="header-row">
      <div>
        <h1>Photo Drop</h1>
        <p class="sub">Tag a completed project photo, preview its filename, and queue it for the Media Center index.</p>
      </div>
    </div>

    <section class="grid drop-grid">
      <div class="panel">
        <div id="dropZone" class="drop-zone" tabindex="0">
          <div>
            <strong>Drop photo</strong>
            <span>JPEG, PNG, or WebP up to 25MB</span>
          </div>
        </div>
        <input id="photo" type="file" accept="image/jpeg,image/png,image/webp" hidden>
        <div style="margin-top:12px"><img id="imagePreview" class="media-preview" alt=""></div>
      </div>

      <form id="mediaForm" class="panel">
        <div class="section-title">Printavo Invoice</div>
        <div class="form-grid">
          <label>Invoice #
            <input id="visualId" name="visualId" inputmode="numeric" pattern="\\d{1,9}" autocomplete="off" required>
          </label>
          <label>Load
            <button id="loadInvoiceBtn" type="button">Load</button>
          </label>
          <label class="full">Group
            <select id="lineGroup" name="lineGroup" disabled required></select>
          </label>
          <label>Line Item
            <select id="lineItem" name="lineItem" disabled required></select>
          </label>
          <label>Imprint
            <select id="imprint" name="imprint" disabled></select>
          </label>
        </div>

        <div class="section-title" style="margin-top:14px">Verified Fields</div>
        <div class="form-grid">
          <label>Brand
            <input id="brand" name="brand" autocomplete="organization">
          </label>
          <label>SKU
            <input id="sku" name="sku">
          </label>
          <label>Color
            <input id="blankColor" name="blankColor">
          </label>
          <label>Method
            <input id="method" name="method">
          </label>
          <label>Ink Type
            <input id="inkType" name="inkType">
          </label>
          <label>Template
            <select id="template" name="template"></select>
          </label>
          <label class="full">Description
            <textarea id="description" name="description"></textarea>
          </label>
        </div>

        <div style="margin-top:14px">
          <div class="section-title">Filename Preview</div>
          <div id="filenamePreview" class="filename-preview">Select tags to preview.</div>
        </div>

        <div class="actions">
          <button id="submitBtn" type="submit" disabled>Submit photo</button>
          <span id="status" class="sub"></span>
        </div>
        <div id="result" class="result card"></div>
      </form>
    </section>

    <section class="panel" style="margin-top:16px">
      <div class="section-title">Recent Assets</div>
      <div id="recent" class="recent-list"><div class="sub">Loading...</div></div>
    </section>
  </main>

  <script>
    const $ = sel => document.querySelector(sel);
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    let invoiceData = null;
    let selectedGroup = null;
    let selectedLineItem = null;
    let selectedImprint = null;
    let selectedDataUrl = "";
    let contentHash = "";
    let previewFilename = "";
    let previewTimer = null;
    const templates = ["Not sure", ...Array.from({ length: 21 }, (_, i) => `Template ${String(i + 1).padStart(2, "0")}`)];

    async function api(url, opts = {}) {
      const r = await fetch(url, { headers: { "Content-Type": "application/json", ...(opts.headers || {}) }, ...opts });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
      return data;
    }

    function fillSelect(el, rows, first, labeler = v => v) {
      el.innerHTML = `${first ? `<option value="">${esc(first)}</option>` : ""}${rows.map(v => `<option value="${esc(v.value ?? v)}">${esc(labeler(v))}</option>`).join("")}`;
    }

    function formPayload() {
      return {
        source: "printavo",
        visualId: $("#visualId").value,
        lineGroupId: selectedGroup?.groupId || "",
        lineItemId: selectedLineItem?.lineItemId || "",
        imprintId: selectedImprint?.imprintId || "",
        brand: $("#brand").value,
        sku: $("#sku").value,
        blank_color: $("#blankColor").value,
        method: $("#method").value,
        ink_type: $("#inkType").value,
        template: $("#template").value,
        description: $("#description").value,
        contentHash,
        ext: selectedDataUrl.match(/^data:image\/(jpeg|jpg|png|webp)/)?.[1]?.replace("jpeg", "jpg") || "jpg"
      };
    }

    function canPreview(p) {
      return p.visualId && p.lineGroupId && p.lineItemId && p.brand && p.blank_color && contentHash;
    }

    function refreshSelection() {
      selectedGroup = invoiceData?.groups.find(g => g.groupId === $("#lineGroup").value) || null;
      selectedLineItem = selectedGroup?.lineItems.find(li => li.lineItemId === $("#lineItem").value) || null;
      selectedImprint = selectedGroup?.imprints.find(im => im.imprintId === $("#imprint").value) || null;
      $("#brand").value = invoiceData?.nickname || selectedGroup?.nickname || "";
      $("#sku").value = selectedLineItem?.sku || "";
      $("#blankColor").value = selectedLineItem?.color || "";
      $("#method").value = selectedLineItem?.method || "";
      $("#inkType").value = selectedImprint?.inkType || "";
      updatePreview();
    }

    function renderInvoicePickers() {
      const groups = invoiceData?.groups || [];
      fillSelect($("#lineGroup"), groups.map(g => ({ value: g.groupId, label: `Group ${g.groupPosition ?? ""} · ${g.nickname || invoiceData.nickname || "No nickname"}` })), "Choose group", x => x.label);
      $("#lineGroup").disabled = !groups.length;
      if (groups.length === 1) $("#lineGroup").value = groups[0].groupId;
      renderGroupChildren();
    }

    function renderGroupChildren() {
      selectedGroup = invoiceData?.groups.find(g => g.groupId === $("#lineGroup").value) || null;
      const lineItems = selectedGroup?.lineItems || [];
      const imprints = selectedGroup?.imprints || [];
      fillSelect($("#lineItem"), lineItems.map(li => ({ value: li.lineItemId, label: `${li.sku || "No SKU"} · ${li.color || "No color"} · ${li.method || "No method"}` })), "Choose line item", x => x.label);
      fillSelect($("#imprint"), imprints.map(im => ({ value: im.imprintId, label: `Imprint ${im.imprintPosition ?? ""} · ${im.inkType || "Ink unmapped"}` })), imprints.length ? "Choose imprint" : "No imprint", x => x.label);
      $("#lineItem").disabled = !lineItems.length;
      $("#imprint").disabled = !imprints.length;
      if (lineItems.length === 1) $("#lineItem").value = lineItems[0].lineItemId;
      if (imprints.length === 1) $("#imprint").value = imprints[0].imprintId;
      refreshSelection();
    }

    async function sha256File(file) {
      const bytes = await file.arrayBuffer();
      const hash = await crypto.subtle.digest("SHA-256", bytes);
      return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2, "0")).join("");
    }

    async function updatePreview() {
      clearTimeout(previewTimer);
      previewTimer = setTimeout(async () => {
        const p = formPayload();
        if (!canPreview(p)) {
          $("#filenamePreview").textContent = contentHash ? "Load invoice and choose a line item to preview." : "Select a photo to compute its hash.";
          $("#submitBtn").disabled = true;
          return;
        }
        try {
          const data = await api("/api/media/preview", { method: "POST", body: JSON.stringify(p) });
          previewFilename = data.filename;
          $("#filenamePreview").textContent = data.filename;
          $("#submitBtn").disabled = !selectedDataUrl || !selectedLineItem || (!!(selectedGroup?.imprints || []).length && !selectedImprint);
        } catch (e) {
          $("#filenamePreview").textContent = e.message;
          $("#submitBtn").disabled = true;
        }
      }, 180);
    }

    async function useFile(file) {
      if (!file) return;
      contentHash = "";
      previewFilename = "";
      $("#submitBtn").disabled = true;
      $("#filenamePreview").textContent = "Computing image hash...";
      contentHash = await sha256File(file);
      const reader = new FileReader();
      reader.onload = () => {
        selectedDataUrl = String(reader.result || "");
        $("#imagePreview").src = selectedDataUrl;
        $("#imagePreview").style.display = "block";
        updatePreview();
      };
      reader.readAsDataURL(file);
    }

    async function loadRecent() {
      try {
        const data = await api("/api/media/recent?limit=10");
        $("#recent").innerHTML = data.assets.length ? data.assets.map(a => `
          <div class="recent-item">
            <strong>${esc(a.filename)}</strong>
            <small>${esc(a.group)} / ${esc(a.cat)} / ${esc(a.color)} - ${esc(a.status)}${a.sink_status ? ` - sink ${esc(a.sink_status)}` : ""}</small>
          </div>
        `).join("") : `<div class="sub">No assets yet.</div>`;
      } catch (e) {
        $("#recent").innerHTML = `<div class="error">${esc(e.message)}</div>`;
      }
    }

    async function loadInvoice() {
      $("#status").textContent = "Loading invoice...";
      $("#loadInvoiceBtn").disabled = true;
      try {
        invoiceData = await api("/api/media/invoice", { method: "POST", body: JSON.stringify({ visualId: $("#visualId").value }) });
        renderInvoicePickers();
        $("#status").textContent = `Loaded invoice ${invoiceData.visualId}`;
      } catch (e) {
        invoiceData = null;
        selectedGroup = selectedLineItem = selectedImprint = null;
        $("#lineGroup").innerHTML = "";
        $("#lineItem").innerHTML = "";
        $("#imprint").innerHTML = "";
        $("#lineGroup").disabled = $("#lineItem").disabled = $("#imprint").disabled = true;
        $("#status").textContent = e.message;
        updatePreview();
      } finally {
        $("#loadInvoiceBtn").disabled = false;
      }
    }

    async function init() {
      fillSelect($("#template"), templates);
      updatePreview();
      loadRecent();
    }

    $("#dropZone").addEventListener("click", () => $("#photo").click());
    $("#dropZone").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") $("#photo").click(); });
    $("#photo").addEventListener("change", e => useFile(e.target.files[0]));
    $("#dropZone").addEventListener("dragover", e => { e.preventDefault(); $("#dropZone").classList.add("drag"); });
    $("#dropZone").addEventListener("dragleave", () => $("#dropZone").classList.remove("drag"));
    $("#dropZone").addEventListener("drop", e => {
      e.preventDefault();
      $("#dropZone").classList.remove("drag");
      useFile(e.dataTransfer.files[0]);
    });
    $("#loadInvoiceBtn").addEventListener("click", loadInvoice);
    $("#visualId").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); loadInvoice(); } });
    $("#lineGroup").addEventListener("change", renderGroupChildren);
    $("#lineItem").addEventListener("change", refreshSelection);
    $("#imprint").addEventListener("change", refreshSelection);
    ["brand", "sku", "blankColor", "method", "inkType", "template", "description"].forEach(id => {
      $("#" + id).addEventListener("input", updatePreview);
    });
    $("#mediaForm").addEventListener("submit", async e => {
      e.preventDefault();
      $("#status").textContent = "Submitting...";
      $("#submitBtn").disabled = true;
      $("#result").style.display = "none";
      try {
        const data = await api("/api/media/intake", { method: "POST", body: JSON.stringify({ ...formPayload(), photo: selectedDataUrl }) });
        const mismatch = previewFilename && data.asset.filename !== previewFilename;
        $("#result").innerHTML = `<strong>${esc(data.asset.filename)}</strong><br><span class="sub">${data.duplicate ? "Already existed; returned existing record." : "Queued locally for the Media Center sink."} Sink: ${esc(data.sink)}.${mismatch ? " Server filename differed from preview." : ""}</span>`;
        $("#result").style.display = "block";
        $("#status").textContent = "Saved";
        await loadRecent();
      } catch (err) {
        $("#status").textContent = err.message;
      } finally {
        updatePreview();
      }
    });

    init().catch(e => {
      $("#filenamePreview").textContent = e.message;
      $("#recent").innerHTML = `<div class="error">${esc(e.message)}</div>`;
    });
  </script>
</body>
</html>
