</head>
<body>
  <header class="topbar">

    <nav class="nav">
      <a href="./" aria-current="page">Dashboard</a>
      <a href="new.html">New Request</a>
      <a href="templates.html">Templates</a>
      <a href="../frontdoor/">Home</a>
    </nav>
  </header>
  <main class="wrap">
    <div class="header-row">
      <div>
        <h1>Dashboard</h1>
        <p class="sub">Simple mockups, colorways, PMS callouts, and request intake.</p>
      </div>
      <a href="new.html"><button>New request</button></a>
    </div>
    <section class="grid dashboard-grid" id="kpis">
      <div class="kpi card"><span>Pending</span><strong id="countPending">0</strong></div>
      <div class="kpi card"><span>Open</span><strong id="countOpen">0</strong></div>
      <div class="kpi card"><span>Completed</span><strong id="countCompleted">0</strong></div>
    </section>
    <section class="panel" style="margin-top:16px">
      <div class="section-title">Recent orders</div>
      <table>
        <thead><tr><th>Title</th><th>Status</th><th>Created</th><th>Updated</th><th>Completed</th></tr></thead>
        <tbody id="ordersBody"><tr><td colspan="5">Loading...</td></tr></tbody>
      </table>
    </section>
  </main>
  <script src="studio.js"></script>
  <script>
    (async () => {
      try {
        const data = await PG.api("/api/graphics/orders");
        PG.$("#countPending").textContent = data.counts.pending || 0;
        PG.$("#countOpen").textContent = data.counts.open || 0;
        PG.$("#countCompleted").textContent = data.counts.completed || 0;
        PG.$("#ordersBody").innerHTML = data.orders.length ? data.orders.map(o => `
          <tr>
            <td><a href="order.html?id=${o.id}"><strong>${PG.esc(o.title || o.order_no || "Untitled")}</strong></a></td>
            <td>${PG.badge(o.status)}</td>
            <td>${PG.fmtDate(o.created_at)}</td>
            <td>${PG.fmtDate(o.updated_at)}</td>
            <td>${PG.fmtDate(o.completed_at)}</td>
          </tr>`).join("") : `<tr><td colspan="5">No graphics requests yet.</td></tr>`;
      } catch (e) {
        PG.$("#ordersBody").innerHTML = `<tr><td colspan="5" class="error">${PG.esc(e.message)}</td></tr>`;
      }
    })();
  </script>
</body>
</html>
